<style>
/* Layout: coluna única para celular, barra de abas fixa embaixo, fichas em cartões simples */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#263238; --muted:#6B7787; --line:#E4E7EC; --field:#EEF0F3; --zebra:#F8F9FA;
  --bar:#3B3B3B; --tabbar:#ECEDEF;
  --teal:#00806F; --teal-soft:#DDF3EE; --blue:#1565C0; --blue-soft:#E2EFFC; --indigo:#303F9F; --indigo-soft:#EEF0FA;
  --orange:#E8590C; --orange-soft:#FDEBE2; --amber:#B85400; --amber-soft:#FFF3E3; --pink:#C2185B; --pink-soft:#FCE6EE;
  --purple:#7B1FA2; --purple-soft:#F4E6F7; --brown:#6D4C41; --brown-soft:#EFE9E6; --green:#43A047; --green-dark:#2E7D32; --green-soft:#E8F4EA;
  --grey:#4F5B66; --grey-soft:#ECEEF1;
  --leaf:var(--teal); --leaf-ink:#FFFFFF; --leaf-soft:var(--teal-soft); --tag:var(--blue-soft); --tag-ink:var(--blue);
  --warn:#B85400; --warn-soft:#FFF3E3; --bad:#C62828; --bad-soft:#FDE7E7;
  --c2:#B85400; --c3:#C2185B; --c4:#6D4C41; --c5:#1565C0;
  --body:"Nunito",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171A; --surface:#1E2124; --ink:#E8EAED; --muted:#9AA3AE; --line:#2C3035; --field:#2A2E33; --zebra:#212428;
  --bar:#0F1012; --tabbar:#1A1C1F;
  --teal:#4DD0B8; --teal-soft:#12302C; --blue:#7DB9F5; --blue-soft:#14273A; --indigo:#A5B0E6; --indigo-soft:#1D2140;
  --orange:#FF8A5C; --orange-soft:#3A1D12; --amber:#FFB561; --amber-soft:#33260F; --pink:#F48FB1; --pink-soft:#3A1A26;
  --purple:#D49AE0; --purple-soft:#2E1B33; --brown:#C9B4AC; --brown-soft:#2C2522; --green:#43A047; --green-dark:#81C784; --green-soft:#17301A;
  --grey:#B8C2CC; --grey-soft:#2A2E33;
  --leaf:var(--teal); --leaf-ink:#0E1A12; --leaf-soft:var(--teal-soft); --tag:var(--blue-soft); --tag-ink:var(--blue);
  --warn:#FFB561; --warn-soft:#33260F; --bad:#EF8F8F; --bad-soft:#3A1F1F;
  --c2:#FFB561; --c3:#F48FB1; --c4:#C9B4AC; --c5:#7DB9F5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1E2124; --ink:#E8EAED; --muted:#9AA3AE; --line:#2C3035; --field:#2A2E33; --zebra:#212428;
  --bar:#0F1012; --tabbar:#1A1C1F;
  --teal:#4DD0B8; --teal-soft:#12302C; --blue:#7DB9F5; --blue-soft:#14273A; --indigo:#A5B0E6; --indigo-soft:#1D2140;
  --orange:#FF8A5C; --orange-soft:#3A1D12; --amber:#FFB561; --amber-soft:#33260F; --pink:#F48FB1; --pink-soft:#3A1A26;
  --purple:#D49AE0; --purple-soft:#2E1B33; --brown:#C9B4AC; --brown-soft:#2C2522; --green:#43A047; --green-dark:#81C784; --green-soft:#17301A;
  --grey:#B8C2CC; --grey-soft:#2A2E33;
  --leaf:var(--teal); --leaf-ink:#0E1A12; --leaf-soft:var(--teal-soft); --tag:var(--blue-soft); --tag-ink:var(--blue);
  --warn:#FFB561; --warn-soft:#33260F; --bad:#EF8F8F; --bad-soft:#3A1F1F;
  --c2:#FFB561; --c3:#F48FB1; --c4:#C9B4AC; --c5:#7DB9F5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--leaf);font:inherit;font-weight:700;padding:6px 4px;cursor:pointer}
.sync{border:1px solid var(--line);background:var(--bg);color:var(--muted);font:inherit;font-size:13px;border-radius:99px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.sync.pend{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.sync.ok{color:var(--leaf);border-color:var(--leaf);background:var(--leaf-soft)}
main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--leaf);font-weight:700}
.tabs button.scan svg{width:30px;height:30px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;border-radius:10px;padding:11px 14px;min-height:46px;cursor:pointer;text-align:center}
.btn.pri{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:focus-visible,.tabs button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
.grid-acoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid-acoes .btn{flex-direction:column;font-size:14px;min-height:64px;padding:8px 4px}
.grid-acoes .btn svg{width:22px;height:22px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit;color:inherit}
.item:first-child{border-top:0}
.item .tx{flex:1;min-width:0}
.item .tx strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx small{color:var(--muted);display:block}
.item .qt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item .qt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.item.sub{padding-left:34px;background:var(--bg)}
.item.sub2{padding-left:54px;background:var(--bg)}
.tag{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:3px 6px 3px 14px;position:relative;white-space:nowrap}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--surface)}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--leaf-soft);color:var(--leaf)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.empty{padding:20px;text-align:center;color:var(--muted)}
.ficha-head{display:flex;flex-direction:column;gap:6px}
.ficha-head h2{text-transform:none;letter-spacing:0;color:var(--ink);font-size:22px;margin:0}
.ficha-head em{color:var(--muted)}
.big{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:8px;border-radius:8px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tl{display:flex;flex-direction:column}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .dt{font-size:13px;color:var(--muted);width:52px;flex:none;font-variant-numeric:tabular-nums}
.ev .bd{flex:1;min-width:0}
.ev .bd img{margin-top:6px;border-radius:8px;max-height:220px}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;max-width:100%}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
textarea{min-height:80px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700}
label.f small{font-weight:400;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.ck input{width:22px;height:22px;min-height:0;flex:none;margin-top:1px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet form,.sheet .sb{display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);font-size:15px}
.label-prev{display:flex;flex-wrap:wrap;gap:10px}
.etq{width:200px;height:120px;background:#fff;color:#000;border:1px dashed #999;border-radius:6px;display:flex;flex-direction:column;gap:3px;padding:6px;flex:none}
.etq .r{display:flex;align-items:center;gap:6px;flex:1;min-height:0}
.etq .bc svg{display:block;width:100%;height:20px}
.etq .bc code{display:block;text-align:center;font-family:var(--mono);font-size:10px;font-weight:700;line-height:1.2}
.bcbox{background:#fff;color:#000;padding:8px;border-radius:8px;width:100%;max-width:300px}
.bcbox svg{display:block;width:100%;height:56px}
.bcbox code{display:block;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px}
.etq .q{width:68px;height:68px;flex:none}
.etq .q svg{width:100%;height:100%}
.etq .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.etq .t b{font-size:13px;line-height:1.15}
.etq .t span{font-size:11px}
.etq .t code{font-family:var(--mono);font-size:11px;font-weight:700}
.qrbox{background:#fff;padding:8px;border-radius:8px;width:150px;height:150px}
.qrbox svg{width:100%;height:100%}
.cliente{display:flex;flex-direction:column;gap:14px}
.cliente img{border-radius:var(--r);width:100%;max-height:340px;object-fit:cover}
.cliente h2{text-transform:none;letter-spacing:0;color:var(--ink);font-size:26px;margin:0}
.preco{font-size:28px;font-weight:700;color:var(--leaf)}
.aviso{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
video{width:100%;border-radius:var(--r);background:#000;max-width:100%}
.top .ico{border:0;background:none;color:var(--muted);padding:6px;margin-right:-6px;cursor:pointer;display:flex;border-radius:8px}
.top .ico svg{width:24px;height:24px}
.top .ico.on{color:var(--leaf)}
.kpi em{font-style:normal;font-weight:700;white-space:nowrap}
.up{color:var(--leaf)} .down,.txt-bad{color:var(--bad)}
.kpi.alerta{border-color:var(--bad);background:var(--bad-soft)}
.chart{display:flex;flex-direction:column;gap:10px}
.chart svg{width:100%;height:auto;max-height:240px;display:block;overflow:visible}
.ax{fill:var(--muted);font-size:11px;font-family:var(--body)}
.ch-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px}
.ch-t .muted{font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,40%) 1fr auto;gap:10px;align-items:center;font-size:14px}
.hbar[role=button]{cursor:pointer}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.hbar .tr span{display:block;height:100%;border-radius:6px}
.hbar .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;min-width:28px;text-align:right}
.hoje{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hoje button,.hoje a{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;border-radius:var(--r);padding:10px 12px;cursor:pointer;text-decoration:none;text-align:left}
.hoje b{font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.hoje .tem{border-color:var(--warn);background:var(--warn-soft)}
.hoje .tem b{color:var(--warn)}
.hoje .tem.bad{border-color:var(--bad);background:var(--bad-soft)}
.hoje .tem.bad b{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;flex-wrap:nowrap}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;border-radius:99px;padding:7px 13px;white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink);font-weight:700}
.guia h4{margin:12px 0 3px;font-size:14px;display:flex;align-items:center;gap:6px}
.guia p{margin:0}
.guia summary{cursor:pointer}
.ctrl{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.lnk{border:0;background:none;color:var(--leaf);font:inherit;font-size:14px;text-decoration:underline;padding:0;cursor:pointer}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:2px}
div.f{display:flex;flex-direction:column;gap:5px}
.segr{flex:1;position:relative;display:flex}
.segr input{position:absolute;opacity:0;width:100%;height:100%;margin:0;min-height:0;cursor:pointer}
.segr span{flex:1;text-align:center;font-size:14px;padding:8px;border-radius:8px;color:var(--muted)}
.segr input:checked+span{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.segr input:focus-visible+span{outline:3px solid var(--leaf)}
.grid-acoes.g2{grid-template-columns:1fr 1fr}
.etp{padding:6px 0;border-top:1px solid var(--line)}
.etp b{display:inline-flex;align-items:center;gap:4px}
.hojebar{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:12px 14px}
button.hojebar{cursor:pointer}
.hojebar.ok{background:var(--leaf-soft);border-color:var(--leaf)}
.relogio{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.hojetx{font-size:17px;line-height:1.35}
.hojetx b{color:var(--warn)}
.lnkt{color:var(--leaf);font-weight:700;font-size:14px}
.etq-img{display:block;width:100%;max-width:400px;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#fff}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (max-width:360px){.grid-acoes{grid-template-columns:repeat(2,1fr)}.f2{grid-template-columns:1fr}}
/* ===== Tema "balcão": barra escura, botões em tons pastel com ícone, números em fonte de caixa ===== */
body{font-family:var(--body);font-size:15px;letter-spacing:.005em}
body::before{background:var(--bar)}
.top{background:var(--bar);border-bottom:0;padding-block:8px;color:#fff}
.top h1{color:#fff;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.top .back{background:var(--orange);color:#fff;border-radius:6px;padding:6px 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;font-weight:800}
.top .ico{color:#fff;opacity:.9}
.top .ico.on{color:var(--orange);opacity:1}
.sync{border:0;background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-radius:6px;padding:7px 10px}
.sync.ok{background:var(--teal);color:#fff}
.sync.pend{background:var(--orange);color:#fff}
main{gap:14px}
h2{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
/* abas de baixo */
nav.tabs{background:var(--tabbar);border-top:0;box-shadow:0 -3px 0 var(--orange) inset}
.tabs button{color:var(--muted);font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:9px 2px 11px}
.tabs button.on{background:var(--surface);color:var(--teal)}
.tabs button.scan{background:var(--green);color:#fff}
.tabs button.scan.on{background:#2E7D32;color:#fff}
/* botões: pílula pastel com rótulo em caixa alta */
.btn{border:0;background:var(--grey-soft);color:var(--grey);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.05em;border-radius:8px;min-height:44px}
.btn.pri{background:var(--teal-soft);color:var(--teal)}

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
"use strict";
/* ============ utilidades ============ */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
function hoje(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function agoraLocal(){const d=new Date();return hoje()+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function diasAtras(n){const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?0:n};
const dataBR=s=>s?String(s).slice(8,10)+'/'+String(s).slice(5,7)+'/'+String(s).slice(0,4):'—';
const dataCurta=s=>s?String(s).slice(8,10)+'/'+String(s).slice(5,7):'';
function diasDesde(s){if(!s)return null;const a=new Date(String(s).slice(0,10)+'T12:00');const b=new Date(hoje()+'T12:00');return Math.round((b-a)/864e5)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;t.setAttribute('role','status');document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}

/* ============ banco local (IndexedDB, com plano B em memória) ============ */
const STORES=['especies','itens','eventos','fotos','ocorrencias','colmeias','outbox','config'];
const TABS=['especies','itens','eventos','fotos','ocorrencias','colmeias'];
const DB={db:null,mem:null,
  async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('viveiro',3);
    r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
    catch(e){this.db=null;this.mem={};STORES.forEach(s=>this.mem[s]=new Map())}},
  st(s,m){return this.db.transaction(s,m).objectStore(s)},
  rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async all(s){return this.db?this.rq(this.st(s,'readonly').getAll()):[...this.mem[s].values()]},
  async get(s,id){return this.db?this.rq(this.st(s,'readonly').get(id)):this.mem[s].get(id)},
  async put(s,o){if(this.db)return this.rq(this.st(s,'readwrite').put(o));this.mem[s].set(o.id,o)},
  async del(s,id){if(this.db)return this.rq(this.st(s,'readwrite').delete(id));this.mem[s].delete(id)},
  async clear(s){if(this.db)return this.rq(this.st(s,'readwrite').clear());this.mem[s].clear()}
};

/* ============ estado ============ */
const S={especies:[],itens:[],eventos:[],fotos:[],ocorrencias:[],colmeias:[],pend:0,cfg:{id:'cfg',url:'',token:'',appUrl:'',diasRega:2,diasAdubo:30,ultimaSync:''}};
const TIPOS={entrada:'Entrada',rega:'Rega',adubacao:'Adubação',tratamento:'Tratamento',crescimento:'Crescimento',perda:'Perda',contagem:'Contagem',venda:'Venda',transf_saida:'Separação',transf_entrada:'Veio de separação',nota:'Anotação',ocorrencia:'Praga/doença registrada',reavaliacao:'Reavaliação',etapa:'Mudança de etapa'};
const DELTA={entrada:1,transf_entrada:1,transf_saida:-1,perda:-1,venda:-1};
const TIPO_ITEM={lote:'Lote',bandeja:'Bandeja',muda:'Muda'};
const ativos=a=>a.filter(x=>!x.excluido);

async function carregar(){
  for(const t of TABS)S[t]=await DB.all(t);
  const c=await DB.get('config','cfg');if(c)S.cfg=Object.assign(S.cfg,c);
  S.pend=(await DB.all('outbox')).length;
}
async function salvar(tabela,reg,{sincronizar=true}={}){
  reg.updatedAt=new Date().toISOString();
  const ref=itemPor(reg.itemId||reg.paiId);if(ref&&ref.exemplo)reg.exemplo=true; // registros feitos em exemplos também são exemplos
  await DB.put(tabela,reg);
  const arr=S[tabela];const i=arr.findIndex(x=>x.id===reg.id);if(i>=0)arr[i]=reg;else arr.push(reg);
  if(sincronizar&&!reg.exemplo){await DB.put('outbox',{id:tabela+':'+reg.id,tabela,refId:reg.id,ts:Date.now()});S.pend=(await DB.all('outbox')).length;agendarSync()}
  pintarSync();
}
let tSync=null;function agendarSync(){clearTimeout(tSync);tSync=setTimeout(()=>sincronizar(false),4000)}
async function salvarCfg(){await DB.put('config',S.cfg)}

/* ============ regras do estoque ============ */
const itemPor=id=>S.itens.find(i=>i.id===id);
const filhos=id=>ativos(S.itens).filter(i=>i.paiId===id).sort((a,b)=>a.codigo<b.codigo?-1:1);
const pai=it=>it&&it.paiId?itemPor(it.paiId):null;
function eventosDe(id){return ativos(S.eventos).filter(e=>e.itemId===id).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0)}
function qtdPropria(id){let q=0;for(const e of eventosDe(id)){if(e.tipo==='contagem')q=num(e.qtd);else if(DELTA[e.tipo])q+=DELTA[e.tipo]*num(e.qtd)}return Math.max(0,q)}
function qtdTotal(id){return qtdPropria(id)+filhos(id).reduce((s,f)=>s+qtdTotal(f.id),0)}
function herda(it,campo){let x=it;while(x){const v=x[campo];if(v!==undefined&&v!==null&&v!=='')return v;x=pai(x)}return ''}
const especiePor=id=>S.especies.find(e=>e.id===id);
const especieDe=it=>especiePor(herda(it,'especieId'));
const nomeDe=it=>especieDe(it)?.nome||'Sem espécie';
const custoDe=it=>num(herda(it,'custoUnit'));
const precoDe=it=>num(herda(it,'precoVenda'))||num(especieDe(it)?.precoVenda);
function ancestrais(it){const r=[];let p=pai(it);while(p){r.push(p);p=pai(p)}return r}
function descendentes(id){return filhos(id).flatMap(f=>[f,...descendentes(f.id)])}
function ultimoManejo(it,tipo){
  const ids=new Set([it.id,...ancestrais(it).map(a=>a.id),...descendentes(it.id).map(d=>d.id)]);
  let u='';for(const e of ativos(S.eventos))if(e.tipo===tipo&&ids.has(e.itemId)&&e.data>u)u=e.data;return u;
}

const urlCache=new Map();
function fotoURL(f){if(!f)return '';if(f.blob){if(!urlCache.has(f.id))urlCache.set(f.id,URL.createObjectURL(f.blob));return urlCache.get(f.id)}
  if(f.fileId)return `https://drive.google.com/thumbnail?id=${encodeURIComponent(f.fileId)}&sz=w800`;return ''}
async function comprimir(file){
  const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.8));
}

function folha(html,{onSubmit,onOpen}={}){
  const bg=document.createElement('div');bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  const fechar=()=>bg.remove();
  bg.addEventListener('click',e=>{if(e.target===bg)fechar()});
  $$('[data-fechar]',bg).forEach(b=>b.onclick=fechar);
  const form=$('form',bg);
  if(form&&onSubmit)form.onsubmit=async e=>{e.preventDefault();const btn=$('button[type=submit]',form);if(btn)btn.disabled=true;
    try{const ok=await onSubmit(new FormData(form),form);if(ok!==false)fechar()}catch(err){console.error(err);toast('Não deu certo: '+err.message)}finally{if(btn)btn.disabled=false}};
  if(onOpen)onOpen(bg,fechar);
  const f1=$('input:not([type=hidden]):not([type=checkbox]),select,textarea',bg);if(f1&&!('ontouchstart' in window))f1.focus();
  return {bg,fechar};
}

/* busca sem acento por nome popular, científico e outros nomes */
const normBusca=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[-_]+/g,' ').replace(/\s+/g,' ');
function buscarEspecies(q,{limite=12}={}){
  const t=normBusca(q).trim();const cad=ativos(S.especies);
  const pont=(nome,cient,alias)=>{if(!t)return 1;const n=normBusca(nome),c=normBusca(cient),a=normBusca(alias);
    if(n.startsWith(t))return 100;if(n.split(' ').some(w=>w.startsWith(t)))return 80;if(c.startsWith(t))return 70;
    if(a.split(/,\s*/).some(w=>w.startsWith(t)))return 60;if(n.includes(t))return 50;if(c.includes(t)||a.includes(t))return 40;return 0};
  const r=[];
  for(const e of cad){const p=pont(e.nome,e.cientifico,e.alias);if(p)r.push({tipo:'cad',e,p:p+5})}
  for(const c of CATALOGO){if(cad.some(e=>(c.cientifico&&e.cientifico===c.cientifico)||normBusca(e.nome)===normBusca(c.nome)))continue;
    const p=pont(c.nome,c.cientifico,c.alias);if(p)r.push({tipo:'cat',c,p})}
  return r.sort((a,b)=>b.p-a.p||(a.tipo===b.tipo?0:a.tipo==='cad'?-1:1)||(a.e||a.c).nome.localeCompare((b.e||b.c).nome)).slice(0,limite);
}
function catalogoPor(cient,nome){const c=normBusca(cient).replace(/\s+spp?\.?$/,''),n=normBusca(nome);
  return CATALOGO.find(x=>c&&normBusca(x.cientifico).replace(/\s+spp?\.?$/,'')===c)||CATALOGO.find(x=>n&&(normBusca(x.nome)===n||normBusca(x.alias).split(/,\s*/).includes(n)))}
function comprasDe(e){let cs=(e&&e.compras)||[];if(typeof cs==='string'){try{cs=JSON.parse(cs)}catch(x){cs=[]}}return Array.isArray(cs)?cs:[]}
function compraDe(e){const cs=comprasDe(e);return cs.length?cs[cs.length-1]:null}
function custoPadraoDe(e){if(!e)return '';if(e.custoPadrao!==''&&e.custoPadrao!=null)return num(e.custoPadrao);const c=compraDe(e);return c?num(c.preco):''}

/* cria a espécie a partir do catálogo (com sigla) */
async function especieDoCatalogo(c,extra={}){
  const e={id:uid(),nome:c.nome,cientifico:c.cientifico||'',familia:c.familia||'',luz:c.luz||'',cuidados:c.cuidados||'',tempoProducao:'',precoVenda:'',
    intervaloRega:'',intervaloAdubacao:'',nativa:c.nativa===undefined?'':(c.nativa?'sim':'não'),grupo:c.grupo||'',custoPadrao:'',compras:[],...extra};
  e.sigla=sugerirSigla(e.nome,e.id);await salvar('especies',e);return e}

/* semeia uma vez as espécies dos cupons de compra */
async function semearCompras(){
  if(S.cfg.comprasSemeadas)return;
  for(const x of COMPRAS_INICIAIS){const c=CATALOGO.find(k=>k.nome===x.nome);if(!c)continue;
    let e=ativos(S.especies).find(s=>!s.exemplo&&(s.cientifico===c.cientifico||normBusca(s.nome)===normBusca(c.nome)));
    if(e){e.compras=[...comprasDe(e),...x.compras];if(e.custoPadrao===''||e.custoPadrao==null)e.custoPadrao=x.compras[0].preco;await salvar('especies',e)}
    else await especieDoCatalogo(c,{compras:x.compras,custoPadrao:x.compras[0].preco})}
  S.cfg.comprasSemeadas=true;await salvarCfg();
}

function resumoEspecie(e){const cp=custoPadraoDe(e);
  return `<b>${esc(e.nome)}</b>${e.cientifico?` · <i>${esc(e.cientifico)}</i>`:''}${e.familia?` · ${esc(e.familia)}`:''}${e.nativa==='sim'?' <span class="pill ok">nativa</span>':''}${cp!==''?` <span class="pill">custo ${brl(cp)}</span>`:''}`}
function ligarCampoEspecie(bg,{aoEscolher}={}){
  const q=$('#espQ',bg),lista=$('#espLista',bg),hid=$('input[name=especieId]',bg),selBox=$('#espSel',bg);
  let itens=[],ativo=-1;
  const escolher=async r=>{let e=r.e;if(r.tipo==='cat'){e=await especieDoCatalogo(r.c);toast(e.nome+' adicionada às suas espécies')}
    else if(r.tipo==='nova'){const nome=r.nome.trim();if(!nome)return;const c=catalogoPor('',nome);
      e=c?await especieDoCatalogo(c):await especieDoCatalogo({nome:nome[0].toUpperCase()+nome.slice(1)});toast('Espécie criada: '+e.nome)}
    hid.value=e.id;q.value=e.nome;selBox.innerHTML=resumoEspecie(e);lista.hidden=true;aoEscolher&&aoEscolher(e)};
  const pintar=()=>{const t=q.value.trim();itens=buscarEspecies(t,{limite:t?12:8});ativo=-1;
    const nova=t&&!itens.some(r=>normBusca((r.e||r.c).nome)===normBusca(t));
    lista.innerHTML=itens.map((r,i)=>{const x=r.e||r.c;const cp=r.e?custoPadraoDe(r.e):'';
      return `<button type="button" role="option" data-i="${i}"><span class="tx"><strong>${esc(x.nome)}</strong><small>${esc(x.cientifico||'')}${x.familia?' · '+esc(x.familia):''}${GRUPOS[x.grupo]?' · '+GRUPOS[x.grupo]:''}${typeof MELIFERAS!=='undefined'&&MELIFERAS.has(x.nome)?' · abelhas':''}</small></span>
      ${r.tipo==='cad'?`<span class="pill ok">sua${cp!==''?' · '+brl(cp):''}</span>`:`<span class="pill">${(x.nativa===true)?'nativa · ':''}catálogo</span>`}</button>`}).join('')
      +(nova?`<button type="button" data-nova="1"><span class="tx"><strong>+ Cadastrar “${esc(t)}”</strong><small>Espécie nova, você completa depois</small></span></button>`:'')
      +(!itens.length&&!nova?'<div class="muted" style="padding:10px">Digite o nome</div>':'');
    lista.hidden=false;
    $$('[data-i]',lista).forEach(b=>b.onmousedown=b.onclick=ev=>{ev.preventDefault();escolher(itens[+b.dataset.i])});
    const bn=$('[data-nova]',lista);if(bn)bn.onmousedown=bn.onclick=ev=>{ev.preventDefault();escolher({tipo:'nova',nome:t})}};
  q.oninput=()=>{hid.value='';selBox.innerHTML='';pintar()};
  q.onfocus=()=>{if(!hid.value)pintar()};
  q.onblur=()=>setTimeout(()=>{lista.hidden=true},180);
  q.onkeydown=ev=>{const bs=$$('button',lista);if(!bs.length)return;
    if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ev.preventDefault();ativo=(ativo+(ev.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('on',i===ativo))}
    else if(ev.key==='Enter'){ev.preventDefault();(bs[ativo>=0?ativo:0]).click()}};
  // identificar pela foto
  const arq=$('#espArq',bg),out=$('#espIA',bg);
  $('#espFoto',bg).onclick=()=>{if(!iaPronta()){toast('Configure o Gemini na engrenagem › Assistente de IA');return}arq.click()};
  arq.onchange=async()=>{const f=arq.files[0];if(!f)return;out.innerHTML='<div class="iares"><p>Identificando a planta…</p></div>';
    try{const d=await iaIdentificarEspecie(f);out.innerHTML=htmlIdentificacao(d);
      $$('[data-idx]',out).forEach(b=>b.onclick=async()=>{const k=+b.dataset.idx;const op=k<0?d:d.alternativas[k];
        const c=catalogoPor(op.cientifico,op.nomePopular);
        let e=ativos(S.especies).find(s=>(op.cientifico&&normBusca(s.cientifico)===normBusca(op.cientifico))||(c&&s.cientifico===c.cientifico));
        if(e)await escolher({tipo:'cad',e});
        else if(c)await escolher({tipo:'cat',c});
        else{const ne=await especieDoCatalogo({nome:op.nomePopular,cientifico:op.cientifico||'',familia:op.familia||'',luz:LUZ_COD[op.luz]||op.luz||'',cuidados:op.cuidados||'',nativa:op.nativaBrasil===true?true:op.nativaBrasil===false?false:undefined});
          await escolher({tipo:'cad',e:ne});toast('Espécie criada pela foto. Confira os dados em Mais › Espécies')}
        out.innerHTML=''})}
    catch(e){out.innerHTML=`<div class="aviso">${esc(e.message)}</div>`}finally{arq.value=''}};
}
async function iaIdentificarEspecie(foto){
  const lista=CATALOGO.map(c=>`${c.nome} (${c.cientifico})`).join('; ');

const ORIGENS_CX=['Compra de meliponário autorizado','Divisão de caixa minha','Isca (captura)','Doação','Resgate (árvore cortada, obra)'];
const MODELOS_CX=['INPA','Fernando Oliveira (PNN)','Racional vertical','Horizontal','Cortiço/tronco','Outro'];
const FORCAS={Forte:'ok','Média':'warn',Fraca:'bad'};
const STATUS_CX=['Ativa','Perdida','Vendida','Doada'];
Object.assign(TIPOS,{revisao_cx:'Revisão da caixa',alimentacao:'Alimentação',colheita_mel:'Colheita de mel',divisao:'Divisão',inimigo:'Inimigo natural'});
const LIMITE_CX=49; // CONAMA 496/2020: até 49 colônias sem fins comerciais dispensa autorização
/* plantas do catálogo que as abelhas visitam bastante (néctar ou pólen) */
const MELIFERAS=new Set(['Pitangueira','Aroeira-pimenteira','Lantana','Camará-da-restinga','Ipê-amarelo','Ipê-roxo','Ipê-branco','Ipê-dourado','Manacá-da-serra','Quaresmeira','Jabuticabeira','Grumixama','Uvaia','Cambuci','Cereja-do-rio-grande','Guabiroba','Goiabeira','Araçá','Acerola','Maracujá','Ingá','Sansão-do-campo','Guapuruvu','Jerivá','Açaí','Juçara','Vedélia','Falsa-érica','Margaridão','Bela-emília','Cajueiro','Mangueira','Laranjeira','Limoeiro','Abacateiro','Grama-amendoim','Canafístula','Sibipiruna','Pau-ferro','Murici','Embaúba','Escova-de-macaco','Russélia','Tumbérgia-azul','Gengibre-azul','Alamanda-amarela','Pitangão','Cambuí','Jambo-vermelho','Bacupari','Capororoca','Pau-pombo','Jambu','Alfavaca','Onze-horas','Fedegoso','Canudo-de-pito','Comandaíba']);

const colmeiaPor=id=>(S.colmeias||[]).find(c=>c.id===id);
const caixasAtivas=()=>ativos(S.colmeias||[]).filter(c=>(c.status||'Ativa')==='Ativa');
const abelhaPor=n=>ABELHAS.find(a=>a.nome===n);
function evsCaixa(id){return ativos(S.eventos).filter(e=>e.itemId===id).sort((a,b)=>a.data<b.data?1:-1)}
function ultimoCx(id,tipo){return evsCaixa(id).find(e=>e.tipo===tipo)}
function forcaCx(c){return ultimoCx(c.id,'revisao_cx')?.estagio||''}
const diasRevCx=()=>num(S.cfg.diasRevCaixa)||15;
function caixasARevisar(){return caixasAtivas().map(c=>{const u=ultimoCx(c.id,'revisao_cx');const d=diasDesde(u?u.data:c.dataEntrada);return {c,d,nunca:!u}})
  .filter(x=>x.d>=diasRevCx()).sort((a,b)=>b.d-a.d)}
function codigoDe(id){return itemPor(id)?.codigo||colmeiaPor(id)?.codigo||''}
function textoCaixa(c){const a=abelhaPor(c.especie)||{};
  return [`${c.codigo} · Caixa de ${c.especie}`,c.cientifico||a.cientifico||'','Entrada: '+dataBR(c.dataEntrada),c.origem?'Origem: '+c.origem:'',c.local?'Local: '+c.local:'','Quintal da Mata'].filter(Boolean).join('\n')}
async function etiquetaCaixa(c){return etiquetaPNG({codigo:c.codigo,dataEntrada:c.dataEntrada,_etq:{nome:c.especie,cient:c.cientifico||'',qr:textoCaixa(c)}})}
function linhaCaixa(c){const f=forcaCx(c);const u=ultimoCx(c.id,'revisao_cx');const d=diasDesde(u?u.data:'');
  const st=c.status&&c.status!=='Ativa';
  return `<button class="item" data-cx="${c.id}"><span class="tag">${esc(c.codigo)}</span><span class="tx"><strong>${esc(c.especie)}</strong><small>${esc(c.local||'sem local')}${u?` · revisada há ${d}d`:' · sem revisão'}</small></span>
    ${st?`<span class="pill">${esc(c.status)}</span>`:f?`<span class="pill ${FORCAS[f]}">${esc(f)}</span>`:''}</button>`}

VIEWS.abelhas=()=>{
  setTitulo('Abelhas nativas');
  const at=caixasAtivas(),todas=ativos(S.colmeias||[]).sort((a,b)=>a.codigo<b.codigo?-1:1);
  const ano=String(new Date().getFullYear());
  const mel=ativos(S.eventos).filter(e=>e.tipo==='colheita_mel'&&colmeiaPor(e.itemId)&&String(e.data).startsWith(ano)).reduce((s,e)=>s+num(e.qtd),0);
  const rev=caixasARevisar();const fora=at.filter(c=>abelhaPor(c.especie)?.ma==='nao');
  $('#view').innerHTML=`
  <div class="kpis">
    <div class="kpi"><b>${at.length}</b><span>caixa${at.length===1?'':'s'} ativa${at.length===1?'':'s'}</span></div>
    <div class="kpi"><b>${mel>=1000?(mel/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' L':mel+' ml'}</b><span>mel colhido em ${ano}</span></div>
    <div class="kpi ${rev.length?'alerta':''}"><b>${rev.length}</b><span>para revisar (a cada ${diasRevCx()} dias)</span></div>
  </div>
  ${at.length>=LIMITE_CX-4?`<div class="aviso">Você está com ${at.length} caixas. Até ${LIMITE_CX} colônias, sem venda, não precisa de autorização ambiental; acima disso, ou para vender colônias, precisa (CONAMA 496/2020).</div>`:''}
  ${fora.length?`<div class="aviso">${fora.map(c=>esc(c.especie)).join(', ')} não é da Mata Atlântica do Sudeste. Criar espécie fora da região de origem precisa de autorização do órgão ambiental.</div>`:''}
  <div class="row"><button class="btn pri add" id="cxNova">Nova caixa</button>${rev.length?`<button class="btn" id="cxRevTodas">Revisar ${rev.length}</button>`:''}</div>
  <h2>Minhas caixas</h2>
  <div class="list">${todas.length?todas.map(linhaCaixa).join(''):'<div class="empty">Nenhuma caixa ainda. Cadastre a sua jataí em “Nova caixa”.</div>'}</div>
  <h2>Espécies de abelhas</h2>
  <div class="list">${ABELHAS.map(a=>`<details class="item abx"><summary><span class="tag">${a.sigla}</span><span class="tx"><strong>${esc(a.nome)}</strong><small><i>${esc(a.cientifico)}</i> · ${esc(a.temp)}</small></span>
    <span class="pill ${a.ma==='sim'?'ok':a.ma==='nao'?'bad':'warn'}">${a.ma==='sim'?'Mata Atlântica SE':a.ma==='nao'?'outra região':'confirmar'}</span></summary>
    <p><b>Onde ocorre:</b> ${esc(a.ocorre)}</p><p>${esc(a.dica)}</p></details>`).join('')}</div>
  <h2>Plantas do viveiro que alimentam abelhas</h2>
  <div class="card" style="font-size:14px">${[...MELIFERAS].filter(n=>CATALOGO.some(c=>c.nome===n)).sort((a,b)=>a.localeCompare(b)).join(' · ')}
    <p class="muted" style="margin:8px 0 0">Bom argumento de venda: “planta que atrai abelhas nativas”. Também aparecem com a marca <b>abelhas</b> na busca de espécies.</p></div>
  <div class="card muted" style="font-size:13px"><b>Regras (Resolução CONAMA 496/2020):</b> até ${LIMITE_CX} colônias, sem vender colônias, não precisa de autorização; criar só espécies da sua região; caixa-isca liberada nesse caso; vender colônias só com meliponário autorizado; vender mel não exige autorização ambiental (mas segue as regras sanitárias). Confira também as normas do INEA no RJ.</div>`;
  $('#cxNova').onclick=()=>formCaixa();
  const rt=$('#cxRevTodas');if(rt)rt.onclick=()=>ir('colmeia',rev[0].c.id);
  $$('[data-cx]').forEach(b=>b.onclick=()=>ir('colmeia',b.dataset.cx));
};

VIEWS.colmeia=(id)=>{
  const c=colmeiaPor(id);if(!c||c.excluido){voltar();return}
  const a=abelhaPor(c.especie)||{};const evs=evsCaixa(c.id);const f=forcaCx(c);const mae=colmeiaPor(c.maeId);
  const filhas=ativos(S.colmeias).filter(x=>x.maeId===c.id);
  const mel=evs.filter(e=>e.tipo==='colheita_mel').reduce((s,e)=>s+num(e.qtd),0);
  setTitulo('Caixa '+c.codigo);
  $('#view').innerHTML=`
  <div class="card ficha-head"><div class="row" style="align-items:center"><span class="tag">${esc(c.codigo)}</span>
    <span class="pill ${(c.status||'Ativa')==='Ativa'?'ok':'bad'}">${esc(c.status||'Ativa')}</span>${f?`<span class="pill ${FORCAS[f]}">${esc(f)}</span>`:''}</div>
    <h2>${esc(c.especie)}</h2>${c.cientifico||a.cientifico?`<em>${esc(c.cientifico||a.cientifico)}</em>`:''}</div>
  <div class="grid-acoes">
    <button class="btn" data-a="revisao_cx">${ic('olho')}Revisão</button>
    <button class="btn" data-a="alimentacao">${ic('gota')}Alimentar</button>
    <button class="btn" data-a="colheita_mel">${ic('abelha')}Colher mel</button>
    <button class="btn" data-a="divisao">${ic('separar')}Dividir</button>
    <button class="btn" data-a="inimigo">${ic('bug')}Inimigo</button>
    <button class="btn" data-a="nota">${ic('mais')}Anotação</button>
    <button class="btn" data-a="etq">${ic('etq')}Etiqueta</button>
    <button class="btn" data-a="editar">${ic('etapa')}Editar</button>
  </div>
  <div class="card"><dl class="dl">
    <dt>Entrada</dt><dd>${dataBR(c.dataEntrada)}</dd><dt>Origem</dt><dd>${esc(c.origem||'—')}</dd>
    ${mae?`<dt>Veio da</dt><dd><button class="btn sm" data-cx="${mae.id}">${esc(mae.codigo)}</button></dd>`:''}
    ${filhas.length?`<dt>Divisões</dt><dd>${filhas.map(x=>`<button class="btn sm" data-cx="${x.id}">${esc(x.codigo)}</button>`).join(' ')}</dd>`:''}
    <dt>Local</dt><dd>${esc(c.local||'—')}</dd><dt>Caixa</dt><dd>${esc(c.modelo||'—')}</dd>
    <dt>Mel colhido</dt><dd>${mel?mel+' ml':'—'}</dd>${c.obs?`<dt>Obs.</dt><dd>${esc(c.obs)}</dd>`:''}</dl></div>
  ${a.dica?`<div class="card muted" style="font-size:14px">${esc(a.dica)}</div>`:''}
  <h2>Histórico</h2>
  <div class="card tl">${evs.length?evs.map(e=>`<div class="ev"><div class="dt">${chipData(e.data)}</div><div class="bd"><b>${esc(TIPOS[e.tipo]||e.tipo)}</b>${e.estagio?` · ${esc(e.estagio)}`:''}${e.qtd?` · ${e.qtd} ml`:''}${e.produto?`<div>${esc(e.produto)}</div>`:''}${e.nota?`<div class="muted">${esc(e.nota)}</div>`:''}</div></div>`).join(''):'<div class="empty">Sem registros ainda.</div>'}</div>`;
  $$('[data-cx]').forEach(b=>b.onclick=()=>ir('colmeia',b.dataset.cx));
  $$('[data-a]').forEach(b=>b.onclick=async()=>{const t=b.dataset.a;
    if(t==='editar')formCaixa(c);else if(t==='divisao')formDivisao(c);
    else if(t==='etq'){let blob;try{blob=await etiquetaCaixa(c)}catch(e){toast('Não consegui gerar a etiqueta');return}
      const url=URL.createObjectURL(blob);const {bg}=folha(`<div class="sb"><h3>Etiqueta · ${esc(c.codigo)}</h3><img src="${url}" class="etq-img" alt="Etiqueta da caixa ${esc(c.codigo)}">
      <div class="muted" style="font-size:14px">O QR leva os dados da caixa em texto; no app, Escanear › QR abre esta ficha.</div>
      <div class="row"><button class="btn" data-fechar>Fechar</button><button class="btn pri" id="shCx">Imprimir / compartilhar</button></div></div>`);
      $('#shCx',bg).onclick=()=>entregarImagens([{nome:`etiqueta-${c.codigo}.png`,blob}])}
    else formEventoCx(c,t)});
};

function formEventoCx(c,tipo){
  const tit={revisao_cx:'Revisão da caixa',alimentacao:'Alimentação',colheita_mel:'Colheita de mel',inimigo:'Inimigo natural',nota:'Anotação'}[tipo];
  folha(`<form><h3>${tit} · ${esc(c.codigo)}</h3>
    <label class="f">Data e hora<input name="data" type="datetime-local" value="${agoraLocal()}" required></label>
    ${tipo==='revisao_cx'?`<label class="f">Como está a colônia<select name="estagio">${Object.keys(FORCAS).map(o=>`<option>${o}</option>`).join('')}</select><small>Forte: muitos discos de cria, potes cheios, bastante movimento na entrada</small></label>`:''}
    ${tipo==='alimentacao'?`<div class="f2"><label class="f">Alimento<select name="produto"><option>Xarope de açúcar 1:1</option><option>Mel da própria espécie</option><option>Pólen / samburá</option><option>Outro</option></select></label><label class="f">Quantidade (ml)<input name="qtd" type="number" inputmode="numeric" min="0"></label></div>`:''}
    ${tipo==='colheita_mel'?`<label class="f">Mel colhido (ml)<input name="qtd" type="number" inputmode="numeric" min="0" required><small>Colha só potes fechados (maduros) e deixe reserva para a colônia</small></label>`:''}
    ${tipo==='inimigo'?`<label class="f">Qual<select name="produto"><option>Forídeo (mosquinha)</option><option>Formigas</option><option>Abelha-limão (pilhagem)</option><option>Lagartixa / aranha</option><option>Fungo / umidade</option><option>Outro</option></select></label>`:''}
    <label class="f">Observação<textarea name="nota" placeholder="${tipo==='revisao_cx'?'Rainha vista? Potes de mel e pólen? Cria nova?':'O que você observou ou fez'}"></textarea></label>
    ${rodapeForm()}</form>`,{onSubmit:async fd=>{
    await salvar('eventos',{id:uid(),itemId:c.id,tipo,data:fd.get('data'),estagio:String(fd.get('estagio')||''),produto:String(fd.get('produto')||''),qtd:fd.get('qtd')?num(fd.get('qtd')):'',nota:String(fd.get('nota')||'')});
    toast((TIPOS[tipo]||'Anotação')+' registrada');render()}});
}
function novoCodigoCx(sp){const n=proximoSerial();S.cfg.ultimoSerial=n;salvarCfg();return (abelhaPor(sp)?.sigla||'AB')+String(n).padStart(6,'0')}
function formCaixa(c){
  const novo=!c;c=c||{};
  folha(`<form><h3>${novo?'Nova caixa de abelha':'Editar '+esc(c.codigo)}</h3>
    <label class="f">Espécie<select name="especie" required>${ABELHAS.map(a=>`<option ${a.nome===(c.especie||'Jataí')?'selected':''}>${a.nome}</option>`).join('')}<option value="__outra" ${c.especie&&!abelhaPor(c.especie)?'selected':''}>Outra…</option></select></label>
    <div id="cxOutra" class="f2" ${c.especie&&!abelhaPor(c.especie)?'':'hidden'}><label class="f">Nome popular<input name="oNome" value="${c.especie&&!abelhaPor(c.especie)?esc(c.especie):''}"></label><label class="f">Científico<input name="oCient" value="${esc(c.cientifico||'')}"></label></div>
    <div id="cxAviso"></div>
    <div class="f2"><label class="f">Data de entrada<input name="dataEntrada" type="date" value="${esc(c.dataEntrada||hoje())}" required></label>
    <label class="f">Situação<select name="status">${STATUS_CX.map(o=>`<option ${o===(c.status||'Ativa')?'selected':''}>${o}</option>`).join('')}</select></label></div>
    <label class="f">Origem<select name="origem">${['',...ORIGENS_CX].map(o=>`<option ${o===(c.origem||'')?'selected':''}>${o}</option>`).join('')}</select></label>
    <div class="f2"><label class="f">Modelo da caixa<select name="modelo">${['',...MODELOS_CX].map(o=>`<option ${o===(c.modelo||'')?'selected':''}>${o}</option>`).join('')}</select></label>
    <label class="f">Local<input name="local" value="${esc(c.local||'')}" placeholder="Ex.: varanda, sombra da pitangueira"></label></div>
    <label class="f">Observações<textarea name="obs">${esc(c.obs||'')}</textarea></label>
    ${rodapeForm(novo?'Criar caixa':'Salvar')}</form>`,{
    onOpen:bg=>{const s=$('select[name=especie]',bg),av=$('#cxAviso',bg);const up=()=>{$('#cxOutra',bg).hidden=s.value!=='__outra';const a=abelhaPor(s.value);
        av.innerHTML=a&&a.ma!=='sim'?`<div class="aviso">${a.ma==='nao'?esc(a.nome)+' não é da Mata Atlântica do Sudeste: criar fora da região de origem precisa de autorização.':'Confirme se a '+esc(a.nome)+' ocorre naturalmente no seu município.'}</div>`:''};
      s.onchange=up;up()},
    onSubmit:async fd=>{let esp=fd.get('especie'),cient=abelhaPor(esp)?.cientifico||'';
      if(esp==='__outra'){esp=String(fd.get('oNome')||'').trim();cient=String(fd.get('oCient')||'').trim();if(!esp){toast('Escreva o nome da abelha');return false}}
      Object.assign(c,{especie:esp,cientifico:cient,dataEntrada:fd.get('dataEntrada'),status:fd.get('status')||'Ativa',origem:fd.get('origem')||'',modelo:fd.get('modelo')||'',local:String(fd.get('local')||'').trim(),obs:String(fd.get('obs')||'').trim()});
      if(novo){c.id=uid();c.codigo=novoCodigoCx(esp);c.maeId=''}
      await salvar('colmeias',c);
      if(novo){if(caixasAtivas().length>LIMITE_CX)toast(`Mais de ${LIMITE_CX} caixas: precisa de autorização ambiental`);ir('colmeia',c.id);await guardarEtiquetaCx(c)}else{toast('Salvo');render()}}});
}
async function guardarEtiquetaCx(c){try{const blob=await etiquetaCaixa(c);if(blob)await salvar('fotos',{id:uid(),itemId:c.id,eventoId:'',tipo:'etiqueta',data:agoraLocal(),blob,fileId:'',nota:'Etiqueta '+c.codigo})}catch(e){console.error(e)}}
function formDivisao(c){
  folha(`<form><h3>Dividir ${esc(c.codigo)}</h3>
    <div class="card muted" style="font-size:14px">Divida só colônia forte, com bastante cria madura (de preferência com realeira, nas Melipona) e na época de florada. A caixa nova vai para o lugar da mãe para receber as campeiras, ou a mãe muda de lugar.</div>
    <label class="f">Data<input name="data" type="date" value="${hoje()}" required></label>
    <label class="f">Local da caixa nova<input name="local" value="${esc(c.local||'')}"></label>
    <label class="f">Observação<textarea name="nota" placeholder="Quantos discos de cria foram, potes, rainha…"></textarea></label>
    ${rodapeForm('Criar caixa nova')}</form>`,{onSubmit:async fd=>{
    const n={id:uid(),codigo:novoCodigoCx(c.especie),especie:c.especie,cientifico:c.cientifico||'',dataEntrada:fd.get('data'),status:'Ativa',origem:'Divisão de '+c.codigo,modelo:c.modelo||'',local:String(fd.get('local')||'').trim(),maeId:c.id,obs:''};
    await salvar('colmeias',n);
    await salvar('eventos',{id:uid(),itemId:c.id,tipo:'divisao',data:fd.get('data')+'T08:00',nota:'Gerou a caixa '+n.codigo+(fd.get('nota')?'. '+fd.get('nota'):'')});
    await salvar('eventos',{id:uid(),itemId:n.id,tipo:'nota',data:fd.get('data')+'T08:00',nota:'Nasceu da divisão de '+c.codigo});
    toast('Caixa '+n.codigo+' criada');if(caixasAtivas().length>LIMITE_CX)toast(`Mais de ${LIMITE_CX} caixas: precisa de autorização ambiental`);
    ir('colmeia',n.id);await guardarEtiquetaCx(n)}});
}

const probPor=id=>BIBLIO.find(b=>b.id===id);
const receitaPor=id=>RECEITAS.find(r=>r.id===id);
function nomeProblema(o){return probPor(o.problemaId)?.nome||o.problemaNome||'Problema'}
function catProblema(o){return probPor(o.problemaId)?.cat||o.categoria||'praga'}

/* ============ regras de manejo ============ */
const SEV={1:['Leve','ok'],2:['Moderada','warn'],3:['Grave','bad']};
function addDias(d,n){const x=new Date(String(d||hoje()).slice(0,10)+'T12:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())}
function intervaloRega(it){const n=num(especieDe(it)?.intervaloRega);if(n>0)return n;return ETAPA_INFO[herda(it,'etapa')]?.rega||num(S.cfg.diasRega)||2}
function intervaloAdubo(it){return num(especieDe(it)?.intervaloAdubacao)||num(S.cfg.diasAdubo)||30}
const ocPor=id=>S.ocorrencias.find(o=>o.id===id);
const ocAbertas=()=>ativos(S.ocorrencias).filter(o=>o.status!=='resolvida');
function ocDoItem(it){const ids=new Set([it.id,...ancestrais(it).map(a=>a.id),...descendentes(it.id).map(d=>d.id)]);return ativos(S.ocorrencias).filter(o=>ids.has(o.itemId))}
const eventosOc=oc=>ativos(S.eventos).filter(e=>e.ocorrenciaId===oc.id).sort((a,b)=>a.data<b.data?1:-1);
function lotesAtivos(){return ativos(S.itens).filter(i=>i.tipo==='lote'&&qtdTotal(i.id)>0)}
function agenda(){
  const lotes=lotesAtivos();
  const rega=lotes.map(l=>{const d=diasDesde(ultimoManejo(l,'rega'));const lim=intervaloRega(l);return {l,d,lim,atraso:d===null?999:d-lim}})
    .filter(x=>x.d===null||x.d>=x.lim).sort((a,b)=>b.atraso-a.atraso);
  const adubo=lotes.filter(l=>!['Semeadura','Germinação'].includes(herda(l,'etapa'))).map(l=>{const u=ultimoManejo(l,'adubacao');return {l,d:diasDesde(u||l.dataEntrada),lim:intervaloAdubo(l),nunca:!u}})
    .filter(x=>x.d>=x.lim).sort((a,b)=>b.d-b.lim-(a.d-a.lim));
  const revisar=ocAbertas().filter(o=>!o.proximaRevisao||o.proximaRevisao<=hoje()).sort((a,b)=>(b.severidade-a.severidade)||(a.proximaRevisao<b.proximaRevisao?-1:1));
  const rustif=ativos(S.itens).filter(i=>i.etapa==='Rustificação'&&qtdTotal(i.id)>0&&(diasDesde(i.dataEtapa)??0)>=30);
  return {lotes,rega,adubo,revisar,rustif};
}
const pillSev=s=>{const v=SEV[num(s)||1];return `<span class="pill ${v[1]}">${v[0]}</span>`};

/* ============ gráficos (SVG e barras simples) ============ */
const fmtCurto=v=>v>=1000?(v/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':String(Math.round(v));
function grafColunas({rotulos,series,h=150,fmtTopo,sobrepor=false,cada=1,rotulo='Gráfico'}){
  const W=320,top=18,bot=20,n=rotulos.length,slot=W/n,bw=Math.min(30,slot*0.64),H=h;
  const tot=i=>sobrepor?Math.max(...series.map(s=>s.v[i]||0)):series.reduce((a,s)=>a+(s.v[i]||0),0);
  const max=Math.max(1,...rotulos.map((_,i)=>tot(i)));const alt=v=>(H-top-bot)*v/max;
  let g=`<line x1="0" x2="${W}" y1="${H-bot+.5}" y2="${H-bot+.5}" style="stroke:var(--line)"/>`;
  rotulos.forEach((r,i)=>{const x=i*slot+(slot-bw)/2;let y=H-bot;
    series.forEach((s,k)=>{const v=s.v[i]||0;if(!v)return;const hh=Math.max(1.5,alt(v));
      if(sobrepor){const w=k?bw*.46:bw;g+=`<rect x="${(x+(bw-w)/2).toFixed(1)}" y="${(H-bot-hh).toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" style="fill:${s.cor}"><title>${esc(r)}: ${esc(s.fmt?s.fmt(v):v)} ${esc(s.nome)}</title></rect>`}
      else{y-=hh;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="2" style="fill:${s.cor}"><title>${esc(r)}: ${v} ${esc(s.nome)}</title></rect>`}});
    const t=tot(i);if(t&&fmtTopo)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(H-bot-alt(t)-5).toFixed(1)}" text-anchor="middle" class="ax">${esc(fmtTopo(t))}</text>`;
    if(i%cada===0||i===n-1)g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-5}" text-anchor="middle" class="ax">${esc(r)}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(rotulo)}">${g}</svg>`;
}
const legenda=itens=>`<div class="legend">${itens.map(([n,c])=>`<span><i style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`;
function barrasH(lista,{fmt=v=>v.toLocaleString('pt-BR'),vazio='Sem dados ainda.'}={}){
  if(!lista.length)return `<div class="empty" style="padding:8px">${vazio}</div>`;
  const max=Math.max(1,...lista.map(x=>x.v));
  return `<div class="hbars">${lista.map(x=>`<div class="hbar" ${x.acao?`data-acao="${esc(x.acao)}" role="button" tabindex="0"`:''}><span class="nm">${esc(x.nome)}</span><span class="tr"><span style="width:${Math.max(2,x.v/max*100).toFixed(1)}%;background:${x.cor||'var(--leaf)'}"></span></span><span class="v">${esc(fmt(x.v))}</span></div>`).join('')}</div>`;
}
function empilhada(lista){if(!lista.length)return '<div class="empty" style="padding:8px">Sem dados ainda.</div>';
  const tot=lista.reduce((s,x)=>s+x.v,0)||1;
  return `<div class="empilhada">${lista.map(x=>`<span style="width:${(x.v/tot*100).toFixed(1)}%;background:${x.cor}"></span>`).join('')}</div>
  <div>${lista.map(x=>`<div class="lg-row" ${x.acao?`data-acao="${esc(x.acao)}" role="button" tabindex="0"`:''}><i style="background:${x.cor}"></i><span>${esc(x.nome)}</span><span class="pc">${Math.round(x.v/tot*100)}%</span><span class="vv">${x.v.toLocaleString('pt-BR')}</span></div>`).join('')}</div>`}
function ultimosMeses(n){const r=[];const d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);r.push({k:x.getFullYear()+'-'+pad(x.getMonth()+1),r:x.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')})}return r}
function estoquePorEspecie(){const m=new Map();for(const l of lotesAtivos()){const n=nomeDe(l);m.set(n,(m.get(n)||0)+qtdTotal(l.id))}
  const arr=[...m].map(([nome,v])=>({nome,v})).sort((a,b)=>b.v-a.v);
  if(arr.length>6){const resto=arr.splice(5);arr.push({nome:`Outras (${resto.length})`,v:resto.reduce((s,x)=>s+x.v,0),cor:'var(--muted)'})}return arr}
function estoquePorEtapa(){const m=new Map();for(const it of ativos(S.itens)){const q=qtdPropria(it.id);if(!q)continue;const e=herda(it,'etapa')||'Sem etapa';m.set(e,(m.get(e)||0)+q)}
  return [...ETAPAS,'Sem etapa'].filter(e=>m.get(e)).map(e=>({nome:e,v:m.get(e),cor:ETAPA_INFO[e]?.cor||'var(--muted)',acao:'etapa:'+e}))}

/* ============ INÍCIO (painel) ============ */
VIEWS.inicio=()=>{
  setTitulo('Quintal da Mata');
  const ev=ativos(S.eventos);const lotes=lotesAtivos();
  const mudas=lotes.reduce((s,l)=>s+qtdTotal(l.id),0);
  const valorEst=ativos(S.itens).reduce((s,i)=>s+qtdPropria(i.id)*precoDe(i),0);
  const meses=ultimosMeses(6);const mes=meses[5].k,mesAnt=meses[4].k;
  const vendas=ev.filter(e=>e.tipo==='venda');
  const rec=k=>vendas.filter(e=>e.data.slice(0,7)===k).reduce((s,e)=>s+num(e.qtd)*num(e.precoUnit),0);
  const luc=k=>vendas.filter(e=>e.data.slice(0,7)===k).reduce((s,e)=>s+num(e.qtd)*(num(e.precoUnit)-num(e.custoUnit)),0);
  const recMes=rec(mes),recAnt=rec(mesAnt),lucMes=luc(mes);
  const varMes=recAnt?Math.round((recMes-recAnt)/recAnt*100):null;
  const entradas=ev.filter(e=>e.tipo==='entrada').reduce((s,e)=>s+num(e.qtd),0);
  const perdas=ev.filter(e=>e.tipo==='perda').reduce((s,e)=>s+num(e.qtd),0);
  const sobrev=entradas?Math.round((1-perdas/entradas)*100):null;
  const abertas=ocAbertas();const graves=abertas.filter(o=>num(o.severidade)===3).length;
  const ag=agenda();
  const dias=[...Array(14)].map((_,i)=>diasAtras(13-i));
  const contaDia=tipo=>dias.map(d=>new Set(ev.filter(e=>e.tipo===tipo&&e.data.slice(0,10)===d).map(e=>e.itemId)).size);
  const porProb=new Map();for(const o of abertas){const n=nomeProblema(o);const x=porProb.get(n)||{nome:n,v:0,sev:0};x.v++;x.sev=Math.max(x.sev,num(o.severidade)||1);porProb.set(n,x)}
  const corSev=s=>s>=3?'var(--bad)':s===2?'var(--warn)':'var(--leaf)';
  const recentes=ev.slice().sort((a,b)=>a.data<b.data?1:-1).slice(0,5);
  $('#view').innerHTML=`
  ${S.itens.some(i=>i.exemplo)?`<div class="aviso">Você está vendo <b>dados de exemplo</b>. Quando quiser começar de verdade, toque na engrenagem › Apagar dados de exemplo.</div>`:''}
  ${faixaHoje()}
  <div class="atalhos">
    <button class="atalho c-teal" data-at="venda"><i>${ic('venda')}</i>Nova venda</button>
    <button class="atalho c-orange" data-at="lote"><i>${ic('broto')}</i>Novo lote</button>
    <button class="atalho c-blue" data-at="rega"><i>${ic('gota')}</i>Regar</button>
    <button class="atalho c-pink" data-at="praga"><i>${ic('bug')}</i>Praga ou doença</button>
    <button class="atalho c-brown" data-at="etq"><i>${ic('etq')}</i>Etiquetas</button>
    <button class="atalho c-purple" data-at="ia"><i>${ic('brilho')}</i>Assistente</button>
    <button class="atalho c-amber" data-at="abelhas"><i>${ic('abelha')}</i>Abelhas</button>
    <button class="atalho c-green" data-at="esp"><i>${ic('folha')}</i>Espécies</button>
  </div>
  <div class="kpis">
    <div class="kpi"><b>${mudas.toLocaleString('pt-BR')}</b><span>mudas em ${lotes.length} lote${lotes.length===1?'':'s'}</span></div>
    <div class="kpi"><b>${brl(valorEst)}</b><span>estoque a preço de venda</span></div>
    <div class="kpi"><b>${brl(recMes)}</b><span>vendido no mês ${varMes===null?'':`<em class="${varMes>=0?'up':'down'}">${varMes>=0?'▲':'▼'} ${Math.abs(varMes)}%</em>`}</span></div>
    <div class="kpi"><b>${brl(lucMes)}</b><span>lucro bruto${recMes?` · margem ${Math.round(lucMes/recMes*100)}%`:''}</span></div>
    <div class="kpi"><b>${sobrev===null?'—':sobrev+'%'}</b><span>sobrevivência (${perdas.toLocaleString('pt-BR')} perdidas)</span></div>
    <div class="kpi ${graves?'alerta':''}"><b>${abertas.length}</b><span>pragas/doenças abertas${graves?` · ${graves} grave${graves>1?'s':''}`:''}</span></div>
  </div>
  <div class="graficos">
  <h2>Vendas</h2>
  <div class="card chart t-indigo largo">
    <div class="ch-t"><b>Últimos 6 meses</b><span class="muted">${brl(meses.reduce((s,m)=>s+rec(m.k),0))}</span></div>
    ${grafColunas({rotulos:meses.map(m=>m.r),series:[{nome:'vendido',cor:'var(--indigo)',v:meses.map(m=>rec(m.k)),fmt:brl},{nome:'lucro',cor:'var(--teal)',v:meses.map(m=>Math.max(0,luc(m.k))),fmt:brl}],sobrepor:true,fmtTopo:fmtCurto,rotulo:'Vendas e lucro por mês'})}
    ${legenda([['Vendido','var(--indigo)'],['Lucro','var(--teal)']])}
  </div>
  <h2>Estoque</h2>
  <div class="card chart t-amber"><div class="ch-t"><b>Estoque por espécie</b><span class="muted">mudas</span></div>${barrasH(estoquePorEspecie().map(x=>({cor:'var(--amber)',...x})))}</div>
  <div class="card chart t-teal"><div class="ch-t"><b>Por etapa de produção</b><span class="muted">toque para ver</span></div>${empilhada(estoquePorEtapa())}</div>
  <h2>Manejo</h2>
  <div class="card chart t-blue">
    <div class="ch-t"><b>Manejo · últimos 14 dias</b><span class="muted">lotes atendidos por dia</span></div>
    ${grafColunas({rotulos:dias.map(d=>d.slice(8,10)),series:[{nome:'rega',cor:'var(--blue)',v:contaDia('rega')},{nome:'adubação',cor:'var(--amber)',v:contaDia('adubacao')},{nome:'tratamento',cor:'var(--pink)',v:contaDia('tratamento')}],cada:2,h:130,rotulo:'Manejo nos últimos 14 dias'})}
    ${legenda([['Rega','var(--blue)'],['Adubação','var(--amber)'],['Tratamento','var(--pink)']])}
  </div>
  <div class="card chart t-pink">
    <div class="ch-t"><b>Perdas por mês</b><span class="muted">mudas</span></div>
    ${grafColunas({rotulos:meses.map(m=>m.r),series:[{nome:'perdidas',cor:'var(--bad)',v:meses.map(m=>ev.filter(e=>e.tipo==='perda'&&e.data.slice(0,7)===m.k).reduce((s,e)=>s+num(e.qtd),0))}],fmtTopo:v=>String(v),h:110,rotulo:'Perdas por mês'})}
  </div>
  <div class="card chart"><div class="ch-t"><b>Pragas e doenças abertas</b><span class="muted">ocorrências</span></div>
    ${barrasH([...porProb.values()].sort((a,b)=>b.sev-a.sev||b.v-a.v).map(x=>({...x,cor:corSev(x.sev)})),{vazio:'Nenhuma ocorrência aberta.'})}
    ${porProb.size?legenda([['Leve','var(--leaf)'],['Moderada','var(--warn)'],['Grave','var(--bad)']]):''}</div>
  </div>
  <h2>Últimos registros</h2>
  <div class="list">${recentes.length?recentes.map(e=>{const it=itemPor(e.itemId);return it?`
    <button class="item" data-item="${it.id}"><span class="tag">${esc(it.codigo)}</span>
    <span class="tx"><strong>${TIPOS[e.tipo]||e.tipo}${e.qtd&&e.tipo!=='rega'?' · '+num(e.qtd):''}</strong><small>${esc(nomeDe(it))} · ${dataBR(e.data)}</small></span></button>`:''}).join(''):`<div class="empty">Nenhum registro ainda.</div>`}</div>`;
  $$('[data-at]').forEach(b=>b.onclick=()=>{const a=b.dataset.at;
    if(a==='venda')escolherItem('Vender de qual lote/muda?',it=>formVenda(it),it=>qtdPropria(it.id)>0);
    else if(a==='lote')formLote();else if(a==='rega')formManejoLote('rega',ag.rega.map(x=>x.l.id));
    else if(a==='praga')escolherItem('Onde está o problema?',it=>formOcorrencia(it),it=>!it.dataSaida);
    else if(a==='etq')ir('etiquetas');else if(a==='ia')aba('assistente');else if(a==='abelhas')ir('abelhas');else if(a==='esp')ir('especies')});
  $$('[data-acao]').forEach(b=>{const go=()=>{const [t,v]=b.dataset.acao.split(':');if(t==='etapa'){filtroEst.etapa=v;aba('estoque')}};b.onclick=go;b.onkeydown=e=>{if(e.key==='Enter')go()}});
  ligarItens();ligarFaixa();
};

  $('#view').innerHTML=`${faixaHoje({clicavel:false})}<div class="seg" id="segM">
    <button data-t="agenda" class="${abaManejo==='agenda'?'on':''}">Agenda</button>
    <button data-t="ocorr" class="${abaManejo==='ocorr'?'on':''}">Pragas e doenças</button>

function linhaLote(l,direita,extra=''){return `<button class="item" data-item="${l.id}"><span class="tag">${esc(l.codigo)}</span>
  <span class="tx"><strong>${esc(nomeDe(l))}</strong><small>${esc(herda(l,'etapa')||'Sem etapa')} · ${esc(l.local||'sem local')}${extra}</small></span>${direita}</button>`}
function linhaOc(o){const it=itemPor(o.itemId);const n=eventosOc(o).filter(e=>e.tipo==='tratamento').length;const venc=o.status!=='resolvida'&&o.proximaRevisao&&o.proximaRevisao<=hoje();
  return `<button class="item" data-oc="${o.id}"><span class="tag">${esc(it?.codigo||'?')}</span>
  <span class="tx"><strong>${esc(nomeProblema(o))}</strong><small>${esc(it?nomeDe(it):'')} · desde ${dataCurta(o.data)}${n?` · ${n} tratamento${n>1?'s':''}`:''}${o.status==='resolvida'?' · resolvida '+dataCurta(o.dataResolvida):venc?' · <b class="txt-bad">revisar</b>':o.proximaRevisao?' · revisar '+dataCurta(o.proximaRevisao):''}</small></span>
  ${o.status==='resolvida'?'<span class="pill ok">Resolvida</span>':pillSev(o.severidade)}</button>`}
function ligarOc(el=document){$$('[data-oc]',el).forEach(b=>b.onclick=()=>ir('ocorrencia',b.dataset.oc))}

    <a href="#" data-pula="adubo" class="${ag.adubo.length?'tem':''}"><b>${ag.adubo.length}</b><span>adubar</span></a>

  ligarOc(el);
}
function manejoOcorr(el){
  const todas=ativos(S.ocorrencias);
  const lst=todas.filter(o=>filtroOc==='todas'||(filtroOc==='abertas'?o.status!=='resolvida':o.status==='resolvida'))
    .sort((a,b)=>filtroOc==='abertas'?(num(b.severidade)-num(a.severidade))||(a.data<b.data?1:-1):(a.data<b.data?1:-1));
  const ab=todas.filter(o=>o.status!=='resolvida');
  const res=todas.filter(o=>o.status==='resolvida'&&o.dataResolvida);
  const tempoMed=res.length?Math.round(res.reduce((s,o)=>s+Math.max(0,diasDesde(o.data)-diasDesde(o.dataResolvida)),0)/res.length):null;
  el.innerHTML=`
  <div class="kpis"><div class="kpi"><b>${ab.length}</b><span>abertas (${ab.filter(o=>num(o.severidade)===3).length} graves)</span></div>
    <div class="kpi"><b>${tempoMed===null?'—':tempoMed+' dias'}</b><span>tempo médio até resolver</span></div></div>
  <button class="btn pri add" id="oNova">Registrar praga ou doença</button>

function manejoGuia(el){

  <div class="chips" id="chG">${[['todos','Tudo'],['praga','Pragas'],['doenca','Doenças'],['nutricao','Nutrição'],['ambiente','Ambiente'],['receitas','Receitas'],['etapas','Etapas']].map(([k,n])=>`<button class="chip ${filtroGuia.cat===k?'on':''}" data-c="${k}">${n}</button>`).join('')}</div>
  <div id="gLista" style="display:flex;flex-direction:column;gap:16px"></div>
  <div class="muted" style="font-size:13px">Resumo dos materiais do seu projeto (receituário da EMATER-PA, manual de mudas do Vale do Ribeira, manual de jardinagem do Rio, cartilhas SENAR e Embrapa). Teste em poucas mudas antes, use luvas e máscara. Agrotóxicos só com receituário agronômico.</div>`;
  const pintar=()=>{const q=filtroGuia.q.trim().toLowerCase(),c=filtroGuia.cat;const casa=t=>!q||t.toLowerCase().includes(q);
    let h='';
    if(c==='todos'||CAT[c]){const ps=BIBLIO.filter(p=>(c==='todos'||p.cat===c)&&casa(p.nome+' '+p.sinais));
      const grupos=c==='todos'?Object.keys(CAT):[c];
      h+=grupos.map(g=>{const xs=ps.filter(p=>p.cat===g);return xs.length?`<h2>${CAT[g]}${g==='nutricao'?' (deficiências)':'s'}</h2><div class="list">${xs.map(p=>{const n=ocAbertas().filter(o=>o.problemaId===p.id).length;
        return `<button class="item" data-prob="${p.id}"><span class="tx"><strong>${esc(p.nome)}</strong><small>${esc(p.sinais.split('. ')[0])}.</small></span>${n?`<span class="pill warn">${n} aberta${n>1?'s':''}</span>`:'›'}</button>`}).join('')}</div>`:''}).join('')}
    if(c==='todos'||c==='receitas'){const rs=RECEITAS.filter(r=>r.preparo!=='—'&&casa(r.nome+' '+r.para));
      if(rs.length)h+=`<h2>Receitas e controles</h2><div class="list">${rs.map(r=>`<button class="item" data-rec="${r.id}"><span class="tx"><strong>${esc(r.nome)}</strong><small>${esc(r.para)}</small></span>›</button>`).join('')}</div>`}
    if(c==='etapas'||(c==='todos'&&!q)){h+=`<h2>Etapas de produção</h2><div class="card guia">${ETAPAS.map((e,i)=>`<h4><span class="dot" style="background:${ETAPA_INFO[e].cor}"></span>${i+1}. ${e}</h4><p>${esc(ETAPA_INFO[e].txt)}</p>`).join('')}</div>`}
    $('#gLista').innerHTML=h||'<div class="empty">Nada encontrado.</div>';
    $$('[data-prob]',el).forEach(b=>b.onclick=()=>verProblema(b.dataset.prob));
    $$('[data-rec]',el).forEach(b=>b.onclick=()=>verReceita(b.dataset.rec));};
  $('#gBusca').oninput=e=>{filtroGuia.q=e.target.value;pintar()};
  $$('#chG button').forEach(b=>b.onclick=()=>{filtroGuia.cat=b.dataset.c;$$('#chG button').forEach(x=>x.classList.toggle('on',x===b));pintar()});
  pintar();
}
function htmlControles(p){return `<ul class="ctrl">${p.ctrl.map(id=>{const r=receitaPor(id);return r?`<li><b>${esc(r.nome)}</b>${r.preparo!=='—'?` <button type="button" class="lnk" data-rec="${r.id}">receita</button>`:''}<br><span class="muted">${esc(r.uso)}</span></li>`:''}).join('')}</ul>`}
function verProblema(id,{registrar=true}={}){const p=probPor(id);if(!p)return;
  const {bg,fechar}=folha(`<div class="sb guia"><h3>${esc(p.nome)}</h3><div><span class="pill ${p.cat==='doenca'?'bad':p.cat==='praga'?'warn':'ok'}">${CAT[p.cat]}</span></div>
    <h4>Sinais</h4><p>${esc(p.sinais)}</p><h4>Prevenção</h4><p>${esc(p.prev)}</p><h4>Como controlar</h4>${htmlControles(p)}
    ${registrar?`<button class="btn pri" id="pReg">Registrar ocorrência disto</button>`:''}<button class="btn" data-fechar>Fechar</button></div>`);
  $$('[data-rec]',bg).forEach(b=>b.onclick=()=>verReceita(b.dataset.rec));
  const r=$('#pReg',bg);if(r)r.onclick=()=>{fechar();escolherItem('Em qual lote ou muda?',it=>formOcorrencia(it,p.id),it=>!it.dataSaida)};
}
function verReceita(id){const r=receitaPor(id);if(!r)return;
  folha(`<div class="sb guia"><h3>${esc(r.nome)}</h3><div class="muted">Para ${esc(r.para)}</div>
    ${r.preparo!=='—'?`<h4>Preparo</h4><p>${esc(r.preparo)}</p>`:''}<h4>Como usar</h4><p>${esc(r.uso)}</p>
    <div class="muted" style="font-size:13px">Fonte: ${esc(r.fonte)}. Use luvas e teste em poucas mudas antes.</div><button class="btn" data-fechar>Fechar</button></div>`)}

/* ============ FICHA DA OCORRÊNCIA ============ */
VIEWS.ocorrencia=(id)=>{
  const o=ocPor(id);if(!o||o.excluido){voltar();return}
  const it=itemPor(o.itemId);const p=probPor(o.problemaId);const evs=eventosOc(o);
  const f=o.fotoId&&S.fotos.find(x=>x.id===o.fotoId&&!x.excluido);
  setTitulo(nomeProblema(o));
  $('#view').innerHTML=`
  <div class="card ficha-head">
    <div class="row" style="align-items:center"><span class="pill ${catProblema(o)==='doenca'?'bad':catProblema(o)==='praga'?'warn':'ok'}">${CAT[catProblema(o)]}</span>
      ${o.status==='resolvida'?`<span class="pill ok">Resolvida em ${dataBR(o.dataResolvida)}</span>`:pillSev(o.severidade)}</div>
    <h2>${esc(nomeProblema(o))}</h2>
    ${it?`<button class="btn sm" data-item="${it.id}" style="align-self:flex-start"><span class="tag">${esc(it.codigo)}</span> ${esc(nomeDe(it))}</button>`:''}
  </div>
  ${o.status!=='resolvida'?`<div class="grid-acoes g2">
    <button class="btn pri" id="oTrat">${ic('spray')}Tratamento</button>
    <button class="btn" id="oReav">${ic('olho')}Reavaliar</button></div>
    <button class="btn" id="oRes">Marcar como resolvida</button>`:`<button class="btn" id="oReab">Reabrir</button>`}
  <div class="card"><dl class="dl">
    <dt>Desde</dt><dd>${dataBR(o.data)} (${diasDesde(o.data)} dias)</dd>
    ${o.pctAfetado!==''&&o.pctAfetado!=null?`<dt>Afetado</dt><dd>${num(o.pctAfetado)}% das mudas</dd>`:''}
    ${o.status!=='resolvida'?`<dt>Revisar</dt><dd>${o.proximaRevisao?dataBR(o.proximaRevisao)+(o.proximaRevisao<=hoje()?` <span class="pill bad">${o.proximaRevisao<hoje()?'atrasada':'hoje'}</span>`:''):'—'}</dd>`:''}
    ${o.nota?`<dt>Obs.</dt><dd>${esc(o.nota)}</dd>`:''}
  </dl>${f?`<img src="${fotoURL(f)}" alt="Foto do problema" style="margin-top:10px;border-radius:8px;width:100%;max-height:260px;object-fit:cover">`:''}</div>
  ${p?`<details class="card guia"><summary><b>Como controlar ${esc(p.nome.toLowerCase())}</b></summary><h4>Sinais</h4><p>${esc(p.sinais)}</p><h4>Prevenção</h4><p>${esc(p.prev)}</p><h4>Controles</h4>${htmlControles(p)}</details>`:''}
  <h2>Acompanhamento</h2>
  <div class="card tl">${evs.length?evs.map(e=>`<div class="ev"><div class="dt">${chipData(e.data)}</div><div class="bd"><strong>${TIPOS[e.tipo]||e.tipo}</strong>${e.produto?`<div class="muted">${esc(e.produto)}</div>`:''}${e.nota?`<div>${esc(e.nota)}</div>`:''}</div></div>`).join(''):'<div class="empty">Nenhum registro ainda.</div>'}</div>
  <button class="btn warn" id="oDel">Apagar ocorrência</button>`;
  const b=id=>$('#'+id);
  if(b('oTrat'))b('oTrat').onclick=()=>formTratamento(o);
  if(b('oReav'))b('oReav').onclick=()=>formReavaliar(o);
  if(b('oRes'))b('oRes').onclick=()=>formReavaliar(o,true);
  if(b('oReab'))b('oReab').onclick=async()=>{o.status='aberta';o.dataResolvida='';o.proximaRevisao=addDias(hoje(),3);await salvar('ocorrencias',o);
    await salvar('eventos',{id:uid(),itemId:o.itemId,tipo:'reavaliacao',ocorrenciaId:o.id,data:agoraLocal(),nota:'Reaberta'});toast('Reaberta');render()};
  $$('[data-rec]').forEach(x=>x.onclick=()=>verReceita(x.dataset.rec));
  b('oDel').onclick=async()=>{const x=b('oDel');if(!x.dataset.conf){x.dataset.conf=1;x.textContent='Toque de novo para apagar';return}
    o.excluido=true;await salvar('ocorrencias',o);toast('Ocorrência apagada');voltar()};
  ligarItens();
};

/* ============ FORMULÁRIOS DE MANEJO ============ */
function opcoesProblemas(sel){return Object.keys(CAT).map(c=>`<optgroup label="${CAT[c]}">${BIBLIO.filter(p=>p.cat===c).map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nome)}</option>`).join('')}</optgroup>`).join('')+'<option value="__outro">Outro (descrever)</option>'}
const segSev=(v=2)=>`<div class="seg" role="radiogroup" aria-label="Severidade">${[1,2,3].map(n=>`<label class="segr"><input type="radio" name="sev" value="${n}" ${n===v?'checked':''}><span>${SEV[n][0]}</span></label>`).join('')}</div>`;
const selRevisao=(d=7)=>`<label class="f">Revisar em<select name="rev">${[[2,'2 dias'],[3,'3 dias'],[7,'1 semana'],[14,'2 semanas'],[30,'1 mês']].map(([n,t])=>`<option value="${n}" ${n===d?'selected':''}>${t}</option>`).join('')}</select></label>`;
function datalistControles(){return `<datalist id="dlCtrl">${RECEITAS.filter(r=>r.preparo!=='—').map(r=>`<option value="${esc(r.nome)}">`).join('')}</datalist>`}
function formOcorrencia(it,probId){
  folha(`<form><h3>Praga ou doença · ${esc(it.codigo)}</h3>
    <label class="f">O que é?<select name="prob" required><option value="">Escolha…</option>${opcoesProblemas(probId)}</select><small><button type="button" class="lnk" id="vSin">Ver sinais para comparar</button></small></label>
    <label class="f" id="outroW" hidden>Descreva<input name="outro" placeholder="Ex.: manchas brancas nas folhas novas"></label>
    <div class="f"><b style="font-size:14px">Gravidade</b>${segSev(2)}</div>
    <div class="f2"><label class="f">% das mudas afetadas<input name="pct" type="number" inputmode="numeric" min="0" max="100" placeholder="Ex.: 20"></label>${selRevisao(7)}</div>
    <label class="f">Foto<input name="foto" type="file" accept="image/*" capture="environment"></label>
    <button type="button" class="btn" id="iaDiag" style="background:var(--purple-soft);color:var(--purple)">Analisar a foto com IA</button><div id="iaOut"></div>
    <label class="f">Observação<textarea name="nota" placeholder="Onde aparece, quantas mudas, desde quando"></textarea></label>
    <label class="ck"><input type="checkbox" name="jaTratou" id="jaT"><span>Já fiz um tratamento agora</span></label>
    <label class="f" id="tratW" hidden>Produto e dose<input name="produto" list="dlCtrl" placeholder="Ex.: Óleo de neem 5 ml/L"></label>${datalistControles()}
    <label class="f">Data<input name="data" type="datetime-local" value="${agoraLocal()}"></label>
    ${rodapeForm('Registrar')}</form>`,{
    onOpen:bg=>{const s=$('select[name=prob]',bg);s.onchange=()=>{$('#outroW',bg).hidden=s.value!=='__outro'};
      $('#jaT',bg).onchange=e=>{$('#tratW',bg).hidden=!e.target.checked};
      $('#vSin',bg).onclick=()=>{if(probPor(s.value))verProblema(s.value,{registrar:false});else toast('Escolha um problema na lista')};
      $('#iaDiag',bg).onclick=async()=>{const f=$('form',bg);const foto=f.foto.files[0];
        if(!iaPronta()){toast('Configure o assistente na engrenagem › Assistente de IA');return}
        if(!foto){toast('Primeiro tire ou escolha uma foto');f.foto.click();return}
        const b=$('#iaDiag',bg);b.disabled=true;b.textContent='Analisando…';
        try{const d=await iaDiagnostico(foto,it,f.nota.value);$('#iaOut',bg).innerHTML=htmlDiagnostico(d);
          if(probPor(d.problemaId))s.value=d.problemaId;else if(d.problemaId!=='saudavel'&&d.nome){s.value='__outro';$('#outroW',bg).hidden=false;f.outro.value=d.nome}
          const sv=[1,2,3].includes(+d.severidade)?+d.severidade:2;const r=$(`input[name=sev][value="${sv}"]`,bg);if(r)r.checked=true;
          if(d.pctAfetado!=null&&d.pctAfetado!=='')f.pct.value=Math.round(+d.pctAfetado)||'';
          const resumo=[d.sinais?'IA: '+d.sinais:'',(d.acoes||[]).length?'Sugestão: '+d.acoes.join('; '):''].filter(Boolean).join('\n');
          if(resumo)f.nota.value=(f.nota.value?f.nota.value+'\n':'')+resumo;
          if(d.problemaId==='saudavel')toast('A planta parece sadia na foto')}
        catch(e){$('#iaOut',bg).innerHTML=`<div class="aviso">${esc(e.message)}</div>`}
        finally{b.disabled=false;b.textContent='Analisar a foto com IA'}};
    },
    onSubmit:async fd=>{
      const pid=fd.get('prob');const outro=String(fd.get('outro')||'').trim();
      if(pid==='__outro'&&!outro){toast('Descreva o problema');return false}
      const data=fd.get('data')||agoraLocal();const ocId=uid();let fotoId='';
      const file=fd.get('foto');if(file&&file.size){let blob;try{blob=await comprimir(file)}catch(e){blob=file}fotoId=uid();
        await salvar('fotos',{id:fotoId,itemId:it.id,eventoId:'',data,blob,fileId:'',nota:'Ocorrência'})}
      const p=probPor(pid);
      const o={id:ocId,itemId:it.id,problemaId:p?pid:'',problemaNome:p?p.nome:outro,categoria:p?p.cat:'praga',severidade:num(fd.get('sev'))||2,
        pctAfetado:fd.get('pct')===''?'':num(fd.get('pct')),data:data.slice(0,10),status:'aberta',dataResolvida:'',proximaRevisao:addDias(data,num(fd.get('rev'))||7),nota:String(fd.get('nota')||''),fotoId};
      await salvar('ocorrencias',o);
      await salvar('eventos',{id:uid(),itemId:it.id,tipo:'ocorrencia',ocorrenciaId:ocId,data,fotoId,nota:`${o.problemaNome} · ${SEV[o.severidade][0].toLowerCase()}${o.pctAfetado!==''?' · '+o.pctAfetado+'% afetado':''}${o.nota?' — '+o.nota:''}`});
      if(fd.get('jaTratou'))await salvar('eventos',{id:uid(),itemId:it.id,tipo:'tratamento',ocorrenciaId:ocId,data,produto:String(fd.get('produto')||''),nota:''});
      toast('Ocorrência registrada');ir('ocorrencia',ocId)}});
}
function formTratamento(o){

function formReavaliar(o,resolver=false){
