  $('#bExp').onclick=()=>{const d={versao:2,gerado:new Date().toISOString()};for(const t of ['especies','itens','eventos','ocorrencias'])d[t]=S[t];d.fotos=S.fotos.map(({blob,...f})=>f);
    entregarArquivo(`viveiro-backup-${hoje()}.json`,JSON.stringify(d),'application/json')};
  $('#bImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());
    for(const t of TABS)for(const x of (d[t]||[])){const loc=await DB.get(t,x.id);if(loc?.blob)x.blob=loc.blob;await DB.put(t,x)}
    await carregar();toast('Dados restaurados');aba('inicio')}catch(err){toast('Arquivo inválido')}};
};

/* ============ VISÃO DO CLIENTE ============ */
let publico=false;
function cartaoCliente(d){
  return `<div class="cliente">${d.foto?`<img src="${esc(d.foto)}" alt="Foto de ${esc(d.nome)}">`:''}
    <div><h2>${esc(d.nome)}</h2>${d.cientifico?`<em class="muted">${esc(d.cientifico)}</em>`:''}</div>
    ${d.precoVenda?`<div class="preco">${brl(d.precoVenda)}</div>`:''}
    ${d.cuidados?`<div class="card"><b>Cuidados</b><div style="white-space:pre-line;margin-top:6px">${esc(d.cuidados)}</div></div>`:''}
    <div class="card"><b>Rastreio desta muda</b><dl class="dl" style="margin-top:8px">
      <dt>Código</dt><dd><span class="tag">${esc(d.codigo)}</span></dd>
      ${d.cadeia?`<dt>Caminho</dt><dd>${esc(d.cadeia)}</dd>`:''}
      ${d.origem?`<dt>Propagação</dt><dd>${esc(d.origem)}</dd>`:''}
      <dt>No viveiro desde</dt><dd>${dataBR(d.dataEntrada)}${diasDesde(d.dataEntrada)!=null?` (${diasDesde(d.dataEntrada)} dias)`:''}</dd>
      ${d.etapa?`<dt>Etapa</dt><dd>${esc(d.etapa)}</dd>`:''}
      ${d.regas?`<dt>Regas registradas</dt><dd>${d.regas}</dd>`:''}
      ${d.ultAdubacao?`<dt>Última adubação</dt><dd>${dataBR(d.ultAdubacao)}</dd>`:''}
      ${d.familia?`<dt>Família</dt><dd>${esc(d.familia)}</dd>`:''}</dl></div></div>`;
}
function dadosClienteLocal(it){const e=especieDe(it)||{};const f=[it,...ancestrais(it)].map(x=>fotosDe(x.id)[0]).find(Boolean);
  const anc=ancestrais(it).reverse();const ids=new Set([it.id,...anc.map(a=>a.id)]);
  return {codigo:it.codigo,nome:nomeDe(it),cientifico:e.cientifico,familia:e.familia,cuidados:e.cuidados,precoVenda:precoDe(it),dataEntrada:anc[0]?anc[0].dataEntrada:it.dataEntrada,foto:fotoURL(f),
    cadeia:anc.length?[...anc,it].map(x=>TIPO_ITEM[x.tipo]+' '+x.codigo).join(' › '):'',origem:herda(it,'origem'),etapa:herda(it,'etapa'),
    regas:ativos(S.eventos).filter(x=>x.tipo==='rega'&&ids.has(x.itemId)).length,ultAdubacao:String(ultimoManejo(it,'adubacao')||'').slice(0,10)}}
VIEWS.cliente=async(codigo)=>{
  setTitulo(publico?'Viveiro':'Visão do cliente');
  const it=ativos(S.itens).find(i=>i.codigo===codigo);
  if(it&&!publico){$('#view').innerHTML=`<div class="aviso">É isto que o cliente vê ao escanear. Custo e margem ficam escondidos.</div>`+cartaoCliente(dadosClienteLocal(it));return}
  $('#view').innerHTML='<div class="empty">Carregando…</div>';
  if(!S.cfg.url){$('#view').innerHTML=it?cartaoCliente(dadosClienteLocal(it)):'<div class="empty">Planta não encontrada.</div>';return}
  try{const r=await fetch(S.cfg.url+'?codigo='+encodeURIComponent(codigo));const d=await r.json();
    $('#view').innerHTML=d.ok?cartaoCliente(d):'<div class="empty">Planta não encontrada.</div>'}
  catch(e){$('#view').innerHTML=it?cartaoCliente(dadosClienteLocal(it)):'<div class="empty">Sem conexão para carregar esta planta.</div>'}
};

async function criarExemplos(){
  const ex={exemplo:true},o={sincronizar:false};
  const cat=n=>CATALOGO.find(c=>c.nome===n);
  const esp=[
    {...cat('Pitangueira'),tempoProducao:'8 a 12 meses',precoVenda:18,intervaloRega:2,intervaloAdubacao:30},
    {...cat('Manacá-da-serra'),tempoProducao:'10 a 14 meses',precoVenda:35,intervaloRega:2,intervaloAdubacao:30},
    {...cat('Bromélia-imperial'),tempoProducao:'18 a 24 meses',precoVenda:45,intervaloRega:4,intervaloAdubacao:45},
    {...cat('Helicônia-papagaio'),tempoProducao:'6 a 8 meses',precoVenda:22,intervaloRega:1,intervaloAdubacao:30},
    {...cat('Ipê-amarelo'),tempoProducao:'8 a 12 meses',precoVenda:25,intervaloRega:'',intervaloAdubacao:30}
  ].map(e=>({id:uid(),...ex,...e}));
  for(const e of esp)await salvar('especies',e,o);
  const mk=async(x)=>{const it={id:uid(),...ex,paiId:'',dataSaida:'',custoUnit:'',precoVenda:'',obs:'',origem:'',etapa:'',dataEtapa:'',...x};await salvar('itens',it,o);return it};
  const ev=async(it,tipo,dias,x={})=>{const r={id:uid(),...ex,itemId:it.id,tipo,data:diasAtras(dias)+'T08:00',...x};await salvar('eventos',r,o);return r};
  const oc=async(it,dias,x)=>{const p=probPor(x.problemaId);const r={id:uid(),...ex,itemId:it.id,problemaNome:p.nome,categoria:p.cat,data:diasAtras(dias),status:'aberta',dataResolvida:'',pctAfetado:'',nota:'',fotoId:'',...x};
    await salvar('ocorrencias',r,o);await ev(it,'ocorrencia',dias,{ocorrenciaId:r.id,nota:`${p.nome} · ${SEV[r.severidade][0].toLowerCase()}${r.pctAfetado!==''?' · '+r.pctAfetado+'% afetado':''}`});return r};
  const regas=async(it,dias)=>{for(const d of dias)await ev(it,'rega',d)};
  const venda=async(it,dias,qtd,preco,custo,cliente='')=>ev(it,'venda',dias,{qtd,precoUnit:preco,custoUnit:custo,cliente});
  const ano=String(new Date().getFullYear()).slice(2);
  // Pitangueira: lote em crescimento, com bandeja e muda individual
  const l1=await mk({tipo:'lote',codigo:novoCodigo(esp[0]),especieId:esp[0].id,dataEntrada:diasAtras(150),local:'Estufa 1, bancada A',origem:'Semente',custoUnit:2.4,etapa:'Crescimento',dataEtapa:diasAtras(60)});
  await ev(l1,'entrada',150,{qtd:200,nota:'Sementes coletadas no quintal'});
  const t1=await oc(l1,138,{problemaId:'tombamento',severidade:3,pctAfetado:10,status:'resolvida',dataResolvida:diasAtras(130),proximaRevisao:'',nota:'Reboleiras na sementeira'});
  await ev(l1,'tratamento',137,{ocorrenciaId:t1.id,produto:'Retirar partes doentes + ajustar a rega'});
  await ev(l1,'perda',135,{qtd:18,nota:'Tombamento'});
  await ev(l1,'reavaliacao',130,{ocorrenciaId:t1.id,nota:'Resolvida'});
  const b1=await mk({tipo:'bandeja',codigo:novoCodigo(esp[0]),paiId:l1.id,dataEntrada:diasAtras(60)});
  await ev(b1,'transf_entrada',60,{qtd:72});await ev(l1,'transf_saida',60,{qtd:72,nota:'Para '+b1.codigo});
  await regas(l1,[1,3,5,7,9,11,13]);await ev(b1,'adubacao',10,{produto:'NPK 10-10-10, 5 g/L'});
  await ev(b1,'crescimento',5,{altura:22,estagio:'Crescimento',nota:'Folhas novas avermelhadas, bom vigor'});
  const m1=await mk({tipo:'muda',codigo:novoCodigo(esp[0]),paiId:b1.id,dataEntrada:diasAtras(20)});
  await ev(m1,'transf_entrada',20,{qtd:1});await ev(b1,'transf_saida',20,{qtd:1,nota:'1 muda individual'});
  await venda(l1,8,12,18,2.4,'Feira de domingo');await venda(l1,40,10,18,2.4,'Feira de domingo');await venda(l1,100,15,17,2.4,'Paisagista Ana');
  // Manacá: rustificando, com pulgão em aberto
  const l2=await mk({tipo:'lote',codigo:novoCodigo(esp[1]),especieId:esp[1].id,dataEntrada:diasAtras(220),local:'Telado sombreado',origem:'Estaca',custoUnit:4.1,precoVenda:38,etapa:'Rustificação',dataEtapa:diasAtras(20)});
  await ev(l2,'entrada',220,{qtd:60});await regas(l2,[3,6,9,12]);await ev(l2,'adubacao',50,{produto:'Esterco curtido'});
  const p2=await oc(l2,6,{problemaId:'pulgao',severidade:2,pctAfetado:20,proximaRevisao:diasAtras(1),nota:'Nos brotos novos, com formigas'});
  await ev(l2,'tratamento',5,{ocorrenciaId:p2.id,produto:'Óleo de neem 5 ml/L'});
  await venda(l2,3,5,38,4.1,'Paisagista Ana');await venda(l2,70,6,35,4.1);await venda(l2,130,4,35,4.1);
  // Bromélia: pronta, cochonilha leve
  const l3=await mk({tipo:'lote',codigo:novoCodigo(esp[2]),especieId:esp[2].id,dataEntrada:diasAtras(400),local:'Área externa',origem:'Divisão de touceira',custoUnit:9,etapa:'Pronta',dataEtapa:diasAtras(30)});
  await ev(l3,'entrada',400,{qtd:25});await regas(l3,[2,6,10]);await ev(l3,'adubacao',20,{produto:'Adubo foliar'});
  await oc(l3,3,{problemaId:'cochonilha',severidade:1,pctAfetado:5,proximaRevisao:diasAtras(-4),nota:'Duas plantas na ponta da bancada'});
  await venda(l3,15,3,45,9);await venda(l3,50,2,45,9,'Condomínio Jardins');await venda(l3,160,4,45,9);
  // Helicônia: rustificação concluída
  const l4=await mk({tipo:'lote',codigo:novoCodigo(esp[3]),especieId:esp[3].id,dataEntrada:diasAtras(120),local:'Estufa 2',origem:'Divisão de touceira',custoUnit:3.5,etapa:'Rustificação',dataEtapa:diasAtras(35)});
  await ev(l4,'entrada',120,{qtd:40});await regas(l4,[1,2,4,5,8]);await ev(l4,'perda',30,{qtd:2,nota:'Queima de sol na mudança'});
  await venda(l4,25,8,22,3.5);await venda(l4,90,6,22,3.5);
  // Ipê-amarelo: germinando
  const l5=await mk({tipo:'lote',codigo:novoCodigo(esp[4]),especieId:esp[4].id,dataEntrada:diasAtras(15),local:'Sementeira',origem:'Semente',custoUnit:1.2,etapa:'Germinação',dataEtapa:diasAtras(15)});
  await ev(l5,'entrada',15,{qtd:150});await regas(l5,[0,1,2,3,4,5,6,7]);await ev(l5,'perda',4,{qtd:9,nota:'Falhas na germinação'});
}

/* ============ início ============ */
(async function iniciar(){
  await DB.open();await carregar();aplicarTema();
  const h=decodeURIComponent(location.hash||'');
  if(h.startsWith('#c-')){publico=true;$('#tabs').hidden=true;$('#btnMais').hidden=true;$('#btnTema').hidden=true;document.querySelector('main').style.paddingBottom='32px';pintarSync();atual={v:'cliente',p:h.slice(3).toUpperCase()};render();return}
  if(S.itens.some(i=>i.exemplo)&&S.cfg.exVer!==3){for(const t of TABS)for(const r of S[t].filter(x=>x.exemplo))await DB.del(t,r.id);await carregar();S.cfg.ultimoSerial=0}
  if(!S.itens.length&&!S.cfg.exemplosApagados&&!S.cfg.url){await criarExemplos();S.cfg.exVer=3;await salvarCfg()}
  pintarSync();render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('./sw.js')}catch(e){}
  sincronizar(false);
  window.addEventListener('online',()=>sincronizar(false));
  setInterval(()=>{if(S.pend>0)sincronizar(false)},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sincronizar(false)});
})();
</script>
