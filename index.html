/* ============ ETIQUETA EM IMAGEM (50×30 mm) ============ */
function textoQR(it){
  const e=especieDe(it)||{};const l=[`${it.codigo} · ${nomeDe(it)}`];
  if(e.cientifico)l.push(e.cientifico);
  l.push('Entrada: '+dataBR(it.dataEntrada));
  const o=herda(it,'origem');if(o)l.push('Origem: '+o);
  const et=herda(it,'etapa');if(et)l.push('Etapa: '+et);
  const lc=herda(it,'local');if(lc)l.push('Local: '+lc);
  const p=precoDe(it);if(p)l.push('Preço: '+brl(p));
  if(e.luz)l.push('Luz: '+e.luz);
  l.push('Quintal da Mata');
  return l.join('\n');
}
const qrEhTexto=()=>S.cfg.qrModo==='texto'||!S.cfg.appUrl;
function quebrar(ctx,txt,larg){
  // quebra nos espaços e também depois de hífen (ex.: Helicônia-|papagaio)
  const ps=[];String(txt).split(/\s+/).forEach((w,i)=>w.split(/(?<=-)/).forEach((p,j)=>ps.push({p,sp:i>0&&j===0})));
  const ls=[];let a='';
  for(const {p,sp} of ps){const t=a?a+(sp?' ':'')+p:p;if(ctx.measureText(t).width<=larg||!a)a=t;else{ls.push(a);a=p}}if(a)ls.push(a);return ls}
/* ============ CÓDIGO DAS PLANTAS: sigla da espécie (2 letras) + número de 6 dígitos ============ */
const semAcento=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z]+/g,' ').trim();
function sugerirSigla(nome,ignorarId){
  const usadas=new Set(ativos(S.especies).filter(e=>e.id!==ignorarId).map(e=>e.sigla).filter(Boolean));
  const w=semAcento(nome).split(' ').filter(Boolean);const cand=[];
  if(w.length){const a=w[0];cand.push(a.slice(0,2));if(w[1])cand.push(a[0]+w[1][0]);for(let i=2;i<a.length;i++)cand.push(a[0]+a[i])}
  for(const c of cand)if(c.length===2&&!usadas.has(c))return c;
  const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(const x of L)for(const y of L)if(!usadas.has(x+y))return x+y;
  return 'XX';
}
function siglaDe(esp){if(!esp)return 'XX';if(!esp.sigla){esp.sigla=sugerirSigla(esp.nome,esp.id);salvar('especies',esp)}return esp.sigla}
function proximoSerial(){let m=num(S.cfg.ultimoSerial);for(const i of S.itens){const r=/^[A-Z]{2}(\d{6})$/.exec(i.codigo||'');if(r)m=Math.max(m,+r[1])}return m+1}
function novoCodigo(esp){const n=proximoSerial();S.cfg.ultimoSerial=n;salvarCfg();return siglaDe(esp)+String(n).padStart(6,'0')}

/* ============ CÓDIGO DE BARRAS Code 128 (padrão lido por qualquer leitor) ============ */
const C128='11011001100,11001101100,11001100110,10010011000,10010001100,10001001100,10011001000,10011000100,10001100100,11001001000,11001000100,11000100100,10110011100,10011011100,10011001110,10111001100,10011101100,10011100110,11001110010,11001011100,11001001110,11011100100,11001110100,11101101110,11101001100,11100101100,11100100110,11101100100,11100110100,11100110010,11011011000,11011000110,11000110110,10100011000,10001011000,10001000110,10110001000,10001101000,10001100010,11010001000,11000101000,11000100010,10110111000,10110001110,10001101110,10111011000,10111000110,10001110110,11101110110,11010001110,11000101110,11011101000,11011100010,11011101110,11101011000,11101000110,11100010110,11101101000,11101100010,11100011010,11101111010,11001000010,11110001010,10100110000,10100001100,10010110000,10010000110,10000101100,10000100110,10110010000,10110000100,10011010000,10011000010,10000110100,10000110010,11000010010,11001010000,11110111010,11000010100,10001111010,10100111100,10010111100,10010011110,10111100100,10011110100,10011110010,11110100100,11110010100,11110010010,11011011110,11011110110,11110110110,10101111000,10100011110,10001011110,10111101000,10111100010,11110101000,11110100010,10111011110,10111101110,11101011110,11110101110,11010000100,11010010000,11010011100,1100011101011'.split(',');
function code128(txt){
  const s=String(txt);const v=[104];let set='B',i=0;
  while(i<s.length){const dig=(s.slice(i).match(/^\d+/)||[''])[0];
    if(dig.length>=4&&(dig.length%2===0||set==='C')){if(set!=='C'){v.push(99);set='C'}const k=dig.length-(dig.length%2);for(let j=0;j<k;j+=2)v.push(+dig.substr(j,2));i+=k;continue}
    if(set!=='B'){v.push(100);set='B'}
    const c=s.charCodeAt(i);if(c<32||c>127)throw new Error('caractere inválido no código');v.push(c-32);i++}
  let soma=v[0];for(let k=1;k<v.length;k++)soma+=v[k]*k;v.push(soma%103,106);
  return v.map(x=>C128[x]).join('');
}
function barrasSVG(txt){try{const b=code128(txt);const n=b.length+20;let r='';
  for(let i=0;i<b.length;){if(b[i]==='1'){let j=i;while(b[j]==='1')j++;r+=`<rect x="${i+10}" y="0" width="${j-i}" height="40"/>`;i=j}else i++}
  return `<svg viewBox="0 0 ${n} 40" preserveAspectRatio="none" role="img" aria-label="Código de barras ${esc(txt)}" style="background:#fff;fill:#000">${r}</svg>`}catch(e){return ''}}
function desenharBarras(x,txt,x0,y0,larg,alt){
  const b=code128(txt);const n=b.length+20;const mw=Math.max(2,Math.floor(larg/n));const ox=Math.round(x0+(larg-mw*n)/2)+10*mw;
  for(let i=0;i<b.length;i++)if(b[i]==='1')x.fillRect(ox+i*mw,y0,mw,alt);
}

/* ============ ETIQUETA EM IMAGEM (50×30 mm · 800×480 px) ============ */
async function etiquetaPNG(it){
  const W=800,H=480,M=18,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
  const topoH=318; // QR + textos em cima; código de barras embaixo
  let tam=0;
  try{const q=qrcode(0,qrEhTexto()?'L':'M');q.addData(it._etq?it._etq.qr:linkQR(it));q.make();const n=q.getModuleCount();
    const cell=Math.max(2,Math.floor((topoH-M)/(n+2)));tam=cell*(n+2);const oy=M+Math.round((topoH-M-tam)/2);
    for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect(M+(k+1)*cell,oy+(r+1)*cell,cell,cell);
  }catch(e){tam=0}
  try{await document.fonts.ready}catch(e){}
  const fam='"Nunito",Arial,Helvetica,sans-serif';
  const tx=M+tam+(tam?16:0),tw=W-tx-M;
  const cient=it._etq?it._etq.cient:(especieDe(it)?.cientifico||'');const nomeE=it._etq?it._etq.nome:nomeDe(it);
  let fs=60,linhas,blocoH;
  for(;;){x.font=`700 ${fs}px ${fam}`;linhas=quebrar(x,nomeE,tw);
    blocoH=linhas.length*fs*1.06+(cient?40:0)+84;
    if((linhas.length<=3&&!linhas.some(l=>x.measureText(l).width>tw)&&blocoH<=topoH-M)||fs<=26)break;fs-=4}
  const lh=fs*1.06;let y=M+Math.max(0,(topoH-M-blocoH)/2)+fs*.82;
  x.font=`700 ${fs}px ${fam}`;for(const l of linhas){x.fillText(l,tx,y);y+=lh}
  if(cient){x.font=`italic 28px ${fam}`;let t=cient;while(x.measureText(t+'…').width>tw&&t.length>4)t=t.slice(0,-1);x.fillText(t===cient?t:t+'…',tx,y+2);y+=40}
  x.font=`400 34px ${fam}`;x.fillText('Entrada '+dataBR(it.dataEntrada),tx,y+8);
  x.font=`800 26px ${fam}`;x.fillText('QUINTAL DA MATA',tx,y+46);
  try{desenharBarras(x,it.codigo,M,topoH+12,W-2*M,96)}catch(e){}
  x.font=`700 36px "JetBrains Mono",Menlo,monospace`;x.textAlign='center';
  x.fillText(it.codigo.replace(/^([A-Z]{2})(\d+)$/,'$1 $2'),W/2,H-12);x.textAlign='left';
  return await new Promise(r=>c.toBlob(r,'image/png'));
}

async function guardarEtiqueta(it){
  try{const blob=await etiquetaPNG(it);if(!blob)return;
    await salvar('fotos',{id:uid(),itemId:it.id,eventoId:'',tipo:'etiqueta',data:agoraLocal(),blob,fileId:'',nota:'Etiqueta '+it.codigo});return blob}catch(e){console.error(e)}
}
async function entregarImagens(arqs){
  const files=arqs.map(a=>new File([a.blob],a.nome,{type:'image/png'}));
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}catch(e){if(e&&e.name==='AbortError')return}
  const urls=arqs.map(a=>URL.createObjectURL(a.blob));
  folha(`<div class="sb"><h3>${arqs.length>1?arqs.length+' etiquetas':'Etiqueta'}</h3>
    <div class="muted" style="font-size:14px">Toque e segure a imagem › <b>Salvar imagem</b>. Depois, no app NIIMBOT, crie uma etiqueta 50×30 mm e insira a imagem.</div>
    ${urls.map((u,i)=>`<img src="${u}" class="etq-img" alt="Etiqueta ${esc(arqs[i].nome)}">`).join('')}
    <button class="btn" data-fechar>Fechar</button></div>`);
}
async function mostrarEtiqueta(it,{titulo,salva=false}={}){
  let blob;try{blob=await etiquetaPNG(it)}catch(e){toast('Não consegui gerar a etiqueta');return}
  const url=URL.createObjectURL(blob);
  const {bg}=folha(`<div class="sb"><h3>${titulo||'Etiqueta · '+esc(it.codigo)}</h3>
    <img src="${url}" class="etq-img" alt="Etiqueta de ${esc(nomeDe(it))}">
    <div class="muted" style="font-size:14px">50 × 30 mm: nome, data de entrada e QR ${qrEhTexto()?'com os dados do lote em texto':'com o link da ficha'} e código de barras (Code 128) com o código ${esc(it.codigo)}.${salva?' Uma cópia vai para o Drive (pasta Etiquetas) na próxima sincronização.':''}</div>
    <div class="row"><button class="btn" data-fechar>${salva?'Depois':'Fechar'}</button><button class="btn pri" id="shEtq">Imprimir / compartilhar</button></div></div>`);
  $('#shEtq',bg).onclick=()=>entregarImagens([{nome:`etiqueta-${it.codigo}.png`,blob}]);
}

/* ============ data, hora e o que fazer hoje ============ */
const MESES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
function chipData(v){const d=String(v||'');if(d.length<10)return '';return `<span class="dchip"><b>${d.slice(8,10)}</b><b>${MESES[+d.slice(5,7)-1]}</b><b>${d.slice(0,4)}</b></span>`}
function relogioTxt(){const d=new Date();const s=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1)+' · '+pad(d.getHours())+':'+pad(d.getMinutes())}
function faixaHoje({clicavel=true}={}){
  const ag=agenda();const p=[];const pl=(n,a,b)=>n+' '+(n===1?a:b);
  if(ag.rega.length)p.push(`<b>regar</b> ${pl(ag.rega.length,'lote','lotes')}`);
  if(ag.adubo.length)p.push(`<b>adubar</b> ${pl(ag.adubo.length,'lote','lotes')}`);
  if(ag.revisar.length)p.push(`<b>revisar</b> ${pl(ag.revisar.length,'praga/doença','pragas/doenças')}`);
  if(ag.rustif.length)p.push(`<b>conferir</b> ${pl(ag.rustif.length,'lote','lotes')} na rustificação`);
  const cxr=caixasARevisar().length;if(cxr)p.push(`<b>olhar</b> ${pl(cxr,'caixa de abelha','caixas de abelha')}`);
  const frase=p.length?'Hoje é dia de '+(p.length>1?p.slice(0,-1).join(', ')+' e '+p[p.length-1]:p[0])+'.':'Tudo em dia no viveiro hoje.';
  const h=new Date().getHours();
  const dica=ag.rega.length&&h>=16?'Se der, deixe a rega para amanhã cedo: folha molhada à noite favorece fungos.':ag.rega.length&&h<10?'Bom horário para regar.':'';
  const tag=clicavel?'button':'div';
  return `<${tag} class="hojebar ${p.length?'':'ok'}" ${clicavel?'data-irmanejo':''}><span class="relogio">${relogioTxt()}</span><span class="hojetx">${frase}</span>${dica?`<small class="muted">${dica}</small>`:''}${clicavel&&p.length?'<small class="lnkt">Ver agenda ›</small>':''}</${tag}>`;
}
function ligarFaixa(){$$('[data-irmanejo]').forEach(b=>b.onclick=()=>{abaManejo='agenda';aba('manejo')})}
setInterval(()=>$$('.relogio').forEach(el=>el.textContent=relogioTxt()),20000);

function ligarItens(){$$('[data-item]').forEach(b=>b.onclick=()=>ir('item',b.dataset.item))}

/* ============ ESTOQUE ============ */
let filtroEst={q:'',mostrar:'ativos',etapa:''};
VIEWS.estoque=()=>{
  setTitulo('Estoque');
  $('#view').innerHTML=`${faixaHoje()}
  <input id="busca" type="search" placeholder="Buscar espécie, código ou local" value="${esc(filtroEst.q)}" aria-label="Buscar">
  <div class="seg" id="segEst">
    <button data-m="ativos" class="${filtroEst.mostrar==='ativos'?'on':''}">Com estoque</button>
    <button data-m="todos" class="${filtroEst.mostrar==='todos'?'on':''}">Todos</button>
  </div>
  <div class="chips" id="chEt"><button class="chip ${!filtroEst.etapa?'on':''}" data-e="">Todas as etapas</button>${[...ETAPAS,'Sem etapa'].map(e=>`<button class="chip ${filtroEst.etapa===e?'on':''}" data-e="${e}">${e}</button>`).join('')}</div>
  <button class="btn pri add" id="eNovo">Novo lote</button>
  <div class="muted" id="resEst" style="font-size:14px;margin-bottom:-6px"></div>
  <div class="list" id="lista"></div>`;
  const pintar=()=>{
    const q=filtroEst.q.trim().toLowerCase();
    let lotes=ativos(S.itens).filter(i=>i.tipo==='lote').sort((a,b)=>a.codigo<b.codigo?1:-1);
    if(filtroEst.mostrar==='ativos')lotes=lotes.filter(l=>qtdTotal(l.id)>0);
    const casa=it=>[it.codigo,nomeDe(it),especieDe(it)?.cientifico,it.local].join(' ').toLowerCase().includes(q);
    if(q)lotes=lotes.filter(l=>casa(l)||descendentes(l.id).some(casa));
    const etOk=it=>!filtroEst.etapa||(herda(it,'etapa')||'Sem etapa')===filtroEst.etapa;
    if(filtroEst.etapa)lotes=lotes.filter(l=>etOk(l)||descendentes(l.id).some(etOk));
    const todos=lotes.flatMap(l=>[l,...descendentes(l.id)]).filter(etOk);
    const nTot=todos.reduce((s,i)=>s+qtdPropria(i.id),0),vTot=todos.reduce((s,i)=>s+qtdPropria(i.id)*precoDe(i),0);
    $('#resEst').textContent=`${lotes.length} lote${lotes.length===1?'':'s'} · ${nTot.toLocaleString('pt-BR')} mudas · ${brl(vTot)} a preço de venda`;
    const linha=(it,nivel)=>{const t=qtdTotal(it.id);const d=diasDesde(ultimoManejo(it,'rega'));
      return `<button class="item ${nivel===1?'sub':nivel===2?'sub2':''}" data-item="${it.id}">
      <span class="tag">${esc(it.codigo)}</span>
      <span class="tx"><strong>${nivel?TIPO_ITEM[it.tipo]+' · ':''}${esc(nomeDe(it))}</strong><small>${esc(herda(it,'etapa')||'sem etapa')} · ${esc(it.local||'—')} · entrada ${dataCurta(it.dataEntrada)}${d!==null?' · regado há '+d+'d':''}</small></span>
      <span class="qt">${t}<small>${t===1?'muda':'mudas'}</small></span></button>`};
    $('#lista').innerHTML=lotes.length?lotes.map(l=>{const fs=filhos(l.id);
      return linha(l,0)+fs.map(b=>linha(b,1)+(b.tipo==='bandeja'?filhos(b.id).slice(0,30).map(m=>linha(m,2)).join(''):'')).join('')}).join('')
      :`<div class="empty">${q?'Nada encontrado.':'Nenhum lote ainda. Toque em “Novo lote” para começar.'}</div>`;
    ligarItens();
  };
  $('#busca').oninput=e=>{filtroEst.q=e.target.value;pintar()};
  $$('#segEst button').forEach(b=>b.onclick=()=>{filtroEst.mostrar=b.dataset.m;$$('#segEst button').forEach(x=>x.classList.toggle('on',x===b));pintar()});
  $('#eNovo').onclick=()=>formLote();
  $$('#chEt button').forEach(b=>b.onclick=()=>{filtroEst.etapa=b.dataset.e;$$('#chEt button').forEach(x=>x.classList.toggle('on',x===b));pintar()});
  pintar();ligarFaixa();
};

      ligarOc(el);

    else if(a==='qr'){el.innerHTML=`<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">

function formSeparar(it){
  const disp=qtdPropria(it.id);
  if(disp<=0){toast('Não há mudas soltas aqui para separar');return}
  folha(`<form><h3>Separar · ${esc(it.codigo)}</h3>
    <div class="muted" style="font-size:14px">Disponível aqui: ${disp}. A quantidade sai daqui e vai para o novo item.</div>
    <label class="f">Separar em<select name="destino">${it.tipo==='lote'?'<option value="bandeja">Uma bandeja nova</option>':''}<option value="muda">Mudas individuais (uma etiqueta para cada)</option></select></label>

    <label class="f">Local<input name="local" value="${esc(it.local||'')}"></label>
    <label class="f">Data<input name="data" type="datetime-local" value="${agoraLocal()}"></label>
    ${rodapeForm('Separar')}</form>`,{onSubmit:async fd=>{
    const q=num(fd.get('qtd')),destino=fd.get('destino'),data=fd.get('data')||agoraLocal(),local=String(fd.get('local')||'');

    if(destino==='muda'&&q>50){toast('Separe no máximo 50 mudas por vez');return false}

function extrairCodigo(txt){if(!txt)return '';const t=String(txt);let m=t.match(/#c-([A-Za-z0-9-]+)/);if(m)return m[1].toUpperCase();
  m=t.match(/\b([A-Za-z]{2})\s?(\d{6})\b/);if(m)return (m[1]+m[2]).toUpperCase();
  m=t.match(/\b([LBM]\d{2}-\d{3}(?:-\d{2}){0,2})\b/i);return (m?m[1]:t.trim()).toUpperCase()}
function abrirPorCodigo(txt){const c=extrairCodigo(txt);const it=ativos(S.itens).find(i=>i.codigo.toUpperCase()===c);

  const cx=ativos(S.colmeias).find(x=>x.codigo.toUpperCase()===c);if(cx){ir('colmeia',cx.id);return true}toast(c?`Código ${c} não encontrado neste celular`:'Não consegui ler o QR');return false}
async function lerImagem(src){
  const bmp=await createImageBitmap(src);
  if('BarcodeDetector' in window){try{const d=new BarcodeDetector({formats:['qr_code','code_128','ean_13']});const r=await d.detect(bmp);if(r[0])return r[0].rawValue}catch(e){}}
  if(!window.jsQR)return null;
  const c=document.createElement('canvas');const sc=Math.min(1,1000/Math.max(bmp.width,bmp.height));c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(bmp,0,0,c.width,c.height);
  const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height);return r?r.data:null;
}

const iaPronta=()=>!!S.cfg.geminiKey;
function iaModelo(){return (S.cfg.geminiModelo||'gemini-flash-latest').trim()}
async function iaModelosDisponiveis(){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':S.cfg.geminiKey}});
  if(!r.ok)throw new Error(r.status===400||r.status===403?'chave inválida':'erro '+r.status);
  const j=await r.json();
  return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''))
    .filter(n=>/flash/.test(n)&&!/(tts|image|audio|live|embedding|thinking|exp)/.test(n));
}
async function gemini({texto,imagem,json=false,sistema}){
  if(!iaPronta())throw new Error('Configure a chave do Gemini na engrenagem › Assistente de IA');
  if(!navigator.onLine)throw new Error('O assistente precisa de internet');
  const parts=[{text:texto}];
  if(imagem){let b=imagem;try{b=await comprimir(imagem)}catch(e){}parts.push({inline_data:{mime_type:'image/jpeg',data:await blobB64(b)}})}
  const corpo={contents:[{role:'user',parts}],generationConfig:{temperature:.3,...(json?{responseMimeType:'application/json'}:{})}};
  if(sistema)corpo.systemInstruction={parts:[{text:sistema}]};
  const chamar=async m=>fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.cfg.geminiKey},body:JSON.stringify(corpo)});
  let r=await chamar(iaModelo());
  if(r.status===404){ // modelo antigo ou nome mudou: escolhe um Flash disponível
    const ms=await iaModelosDisponiveis();const m=ms.find(n=>!/lite|preview/.test(n))||ms[0];
    if(m){S.cfg.geminiModelo=m;await salvarCfg();r=await chamar(m)}}
  if(r.status===429)throw new Error('Limite gratuito do Gemini atingido. Tente de novo em alguns minutos.');
  if(r.status===400||r.status===403){let msg='';try{msg=(await r.json()).error?.message||''}catch(e){}throw new Error(/API key/i.test(msg)?'Chave do Gemini inválida':'O Gemini recusou o pedido'+(msg?': '+msg:''))}
  if(!r.ok)throw new Error('Gemini indisponível ('+r.status+')');
  const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
  if(!t)throw new Error('O Gemini não respondeu. Tente outra foto ou reformule.');
  if(!json)return t;
  try{return JSON.parse(t.replace(/^```(json)?|```$/g,''))}catch(e){throw new Error('Resposta do Gemini fora do formato')}
}

 {t:'Irrigação',k:'rega regar irrigacao agua horario quantas vezes manha tarde encharcar',f:'Manual de mudas (Vale do Ribeira); Manual do Horto Rizzini; SENAR-PR',x:'Regue no começo da manhã e/ou no início da tarde; evite o fim da tarde, porque folha molhada à noite favorece fungos e bactérias. Na semeadura, use gotas finas para não descobrir as sementes. Plântulas e estacas em crescimento costumam ser regadas 2 vezes ao dia. Analise a qualidade da água e garanta drenagem: água parada no viveiro favorece doenças.'},
 {t:'Manejo diário das mudas',k:'manejo monda daninha danca mudar lugar selecao descarte uniformizar limpeza ferramenta',f:'Manual de mudas (Vale do Ribeira); Embrapa Circular 47; Manual do Horto Rizzini',x:'Monda: tire o mato à mão sem desmanchar o torrão. Dança: mude os saquinhos de lugar para a raiz não pegar no chão e o lote crescer por igual. Troque sacos rasgados ou pequenos. Separe as mudas por tamanho e afaste as bem enfolhadas para ventilar. Descarte as muito doentes (são fonte de contágio). Lave as ferramentas, desinfete tubetes com água sanitária e solarize o substrato.'},
 {t:'Prevenção de doenças no viveiro',k:'doenca prevenir estresse tombamento densidade fungo drenagem patogeno',f:'Embrapa Circular Técnica 47 (Estratégias de manejo de doenças em viveiros)',x:'Qualquer estresse (falta ou excesso de água e nutrientes, transplante mal feito, muda velha demais no saquinho) abre caminho para fungos. Sementeira muito densa ou semente enterrada fundo favorece tombamento. Mantenha drenagem, sombra na medida, material de propagação de boa qualidade e descarte mudas doentes.'},
 {t:'Rustificação, padrão e transporte',k:'rustificacao rustificar pronta tamanho altura venda expedicao transporte caminhao',f:'Manual de mudas (Vale do Ribeira); Manual do Horto Rizzini',x:'Antes de vender, deixe as mudas cerca de 30 dias a pleno sol, reduzindo a rega aos poucos. O Horto Rizzini libera mudas com no mínimo 30 cm. No transporte, use carroceria fechada (baú), de preferência com prateleiras; em carroceria aberta as mudas ressecam e morrem.'},
 {t:'Tempo de produção de nativas (exemplos)',k:'tempo producao dias meses crescimento lento rapido guanandi murici comandaiba palmeira',f:'Manual do Horto Carlos Toledo Rizzini (RJ)',x:'Exemplos do Horto Rizzini (semente até muda de 30 cm, com 30 dias de rustificação): guanandi ~250 dias; comandaíba ~300 dias; murici e baba-de-boi ~360 dias. Crescimento rápido: menos de 4 meses no viveiro; lento: 4 a 8 meses. Use isso para planejar quando semear para ter mudas prontas na época de maior venda.'},
 {t:'Registro no RENASEM e legislação de mudas',k:'renasem legislacao registro mapa lei 10711 instrucao normativa responsavel tecnico legal regularizar',f:'Manual de mudas (Vale do Ribeira); Sebrae – Como montar um negócio de flores',x:'Quem produz e vende mudas precisa se inscrever no RENASEM (MAPA), pela internet, pagando taxa e indicando os grupos de espécies (ex.: ornamentais, florestais – Portaria MAPA 501/2022), com responsável técnico. Base legal: Lei 10.711/2003 e Decreto 10.586/2020. Para nativas, florestais ou de interesse ambiental, a IN MAPA 17/2017 criou procedimento simplificado para quem produz até 10.000 mudas/ano na própria área; nesse caso o responsável técnico pode ser outro profissional além de agrônomo ou engenheiro florestal, e o comércio ambulante é permitido. Agricultores familiares que só trocam ou vendem entre si dispensam registro; vender a terceiros exige. Confirme as regras atuais na Superintendência do MAPA do seu estado.'},
 {t:'Nota fiscal e documentação',k:'nota fiscal inscricao estadual produtor rural vender formal documento servico',f:'Manual de mudas (Vale do Ribeira)',x:'Para vender, o produtor rural emite nota fiscal de produtor (simplificada). A inscrição estadual de produtor é gratuita na Secretaria da Fazenda, com documentos do imóvel, CPF e RG. Serviços (plantio, manutenção de jardim) não entram na nota de produtor: precisam de nota de serviço da prefeitura.'},
 {t:'Custos fixos e variáveis',k:'custo fixo variavel despesa capital giro lucro financeiro controle gasto',f:'Sebrae – Ideia de negócio: floricultura',x:'Custos variáveis mudam com a produção (sementes, substrato, saquinhos, adubo, embalagem, frete). Custos fixos ficam iguais todo mês (aluguel, água, luz, internet, contador, mão de obra fixa). Controle desperdícios e perdas, compre bem e acompanhe o capital de giro: quanto menores os custos, maior o resultado. A Planejadora Financeira do Sebrae ajuda a simular.'},
 {t:'Formação de preço e cadeia de valor',k:'preco precificar quanto cobrar margem markup atacado varejo valor venda',f:'Hórtica/Sebrae (5518); PDP Flores e Plantas Ornamentais (DF); catálogo Brasil Nativas',x:'Na cadeia das flores, se o produtor recebe 100, o atacado vende por ~150 e o varejo por ~350. No DF, atacadistas trabalham com margem média de 85% sobre a compra. Monte o custo unitário (semente ou matriz, substrato, recipiente, adubo, água, mão de obra rateada e as perdas) e some sua margem; compare com o mercado. Referências de lojas online de nativas: ipê-amarelo de 1 m ~R$ 78, jasmim-cachorro ~R$ 28, bromélia-imperial ~R$ 116 (preços anunciados, podem mudar).'},
 {t:'Mercado de flores e plantas ornamentais',k:'mercado setor crescimento consumo cliente vendas tendencia faturamento',f:'Sebrae – Pesquisa de redes sociais (2023), dados Ibraflor e Cepea',x:'O setor cresceu 15% entre 2020 e 2021 e faturou R$ 10,9 bilhões (Ibraflor): decoração 30%, autosserviço (supermercados) 21% e paisagismo 20%. Consumo de cerca de R$ 51 por pessoa ao ano (Cepea, 2021). Lojas online, supermercados e garden centers ampliaram o acesso. As plantas ornamentais (suculentas, samambaia, zamioculca, ficus) são 24% das vendas.'},
 {t:'Canais de venda',k:'vender canal cliente paisagista garden center feira online instagram whatsapp atacado',f:'PDP Flores e Plantas Ornamentais (DF); Sebrae – Pesquisa de redes sociais',x:'Canais possíveis: venda direta (feiras, no viveiro, WhatsApp e Instagram), paisagistas e jardineiros, garden centers e lojas, atacadistas informais (no DF respondem por 30–40% do faturamento do segmento), prefeituras e projetos de restauração. Nas redes, clientes procuram cuidados, plantas resistentes ao sol e onde comprar: fotos reais, dicas de cuidado e entrega ajudam a vender.'},
 {t:'Nativas: nome científico e valor',k:'nativa nome cientifico popular especie restauracao fauna paisagismo sustentavel',f:'Manual de mudas (Vale do Ribeira); catálogos do projeto',x:'Use sempre o nome científico na venda e nas etiquetas: nomes populares mudam de região para região. Conheça cada espécie (porte, se é pioneira, época de flor e semente, se gosta de área úmida) e o uso final (paisagismo, restauração, arborização). Espécies atrativas de fauna são um argumento de venda forte no paisagismo sustentável.'},
 {t:'Trabalho em rede',k:'rede cooperativa associacao parceria coletivo assistencia tecnica',f:'Manual de mudas (Vale do Ribeira)',x:'Redes de viveiristas (ex.: Rede de Viveiros de Mudas Nativas do Vale do Ribeira) ajudam com assistência técnica, regularização no RENASEM, divulgação, capacitação e planos de negócio. Ter as informações organizadas (fichas de coleta, produção e vendas) melhora as vendas e o acesso a projetos e políticas públicas.'},
 {t:'Qualidade da água de irrigação',k:'agua irrigacao qualidade ph condutividade ce filtro turbidez algas poco',f:'E-book Plantas ornamentais: conceitos básicos de cultivo (Menegaes, Ferreira e Moccellin, 2022), cap. 3',x:'A água da rega precisa ser limpa em três sentidos. Química: pH perto de 5,5 a 6,5 e sem excesso de sais (medidos pela condutividade elétrica, CE). Física: sem barro ou areia em suspensão, que entopem gotejadores; use filtro de areia, disco ou tela. Biológica: sem algas, fungos e bactérias, que levam doença para as mudas; filtro de areia ajuda. Regue nos horários mais frescos. Rega demais favorece fungos; rega de menos trava o crescimento.'},
 {t:'Sistemas de irrigação para viveiro',k:'gotejamento microaspersao aspersao subirrigacao mangueira irrigacao sistema molhar folha fertirrigacao',f:'E-book Plantas ornamentais (2022), cap. 3',x:'Gotejamento: gasta pouca água, não molha as folhas e permite adubar pela água (fertirrigação); é o mais usado em estufa e em vasos. Microaspersão: jatos finos perto das plantas, cobre mais área que o gotejo. Aspersão (tipo chuva): eficiente, mas molha a folhagem e piora doenças. Subirrigação (mesa ou calha que molha por baixo): água vai direto às raízes. Em telado e campo os mais comuns são aspersão, microaspersão e gotejamento. Sempre que puder, molhe o substrato e não as folhas.'},
 {t:'Luz: sol pleno, meia-sombra e sombra',k:'luz sol pleno meia sombra sombra lux estiolamento luminosidade horas de sol',f:'E-book Plantas ornamentais (2022), cap. 3',x:'Sol pleno: precisa de pelo menos 4 a 6 horas de sol direto por dia (acima de ~2.000 lux). Meia-sombra: muita claridade, mas sem sol direto entre 10 h e 17 h (500 a 1.000 lux). Sombra: não tolera sol direto e precisa de pelo menos 2 horas de luz indireta (300 a 500 lux). Pouca luz causa estiolamento: entrenós compridos, muda fraca e mais sujeita a pragas e doenças.'},
 {t:'Fotoperíodo e floração',k:'fotoperiodo dia curto dia longo floracao florescer crisantemo kalanchoe gerânio rosa luz artificial',f:'E-book Plantas ornamentais (2022), cap. 3',x:'Algumas plantas só florescem conforme o tamanho do dia. Dia curto: crisântemo (no comércio recebe luz extra até 14 h de dia para segurar a flor, ou escurecimento para induzir). Dia longo: gipsófila. Neutras (florescem em qualquer época): rosa. Flor-da-fortuna (kalanchoe) precisa de dias longos e depois curtos; gerânio, o inverso. Isso explica por que algumas espécies só florescem em certa estação e ajuda a planejar a venda em datas comemorativas.'},
 {t:'Temperatura e umidade do ar',k:'temperatura calor frio geada umidade do ar seca estufa abafada ventilacao',f:'E-book Plantas ornamentais (2022), cap. 3',x:'A maioria das plantas cresce melhor entre 20 e 30 °C. Calor demais faz a planta fechar os estômatos, parar de crescer e murchar; frio e geada rompem as células das folhas. Umidade do ar alta demais: água condensa nas folhas, aparecem doenças e o cálcio não chega às bordas das folhas. Umidade baixa demais: favorece ácaros e alguns míldios e a rega fica crítica. Ventile estufas e telados nas horas quentes.'},
 {t:'Quebra-vento',k:'quebra vento vento barreira cerca viva protecao arvores bambu',f:'E-book Plantas ornamentais (2022), cap. 3',x:'Vento forte tomba e machuca as mudas e estraga a estrutura. Monte o quebra-vento misturando árvores e arbustos, deixando passar 40% a 50% do vento (barreira totalmente fechada cria redemoinho). Uma fileira protege uma faixa de até cerca de 10 vezes a sua altura. Escolha espécies de crescimento rápido, eretas, raiz profunda, folhas o ano todo e galhos flexíveis.'},
 {t:'Canteiros no chão: medidas e preparo',k:'canteiro medida largura comprimento rua caminho preparo solo encanteirar mulching cobertura palha declive',f:'E-book Plantas ornamentais (2022), cap. 3',x:'Canteiros de 1,0 a 1,2 m de largura, no máximo 10 m de comprimento, elevados 10 a 20 cm, com ruas de 40 a 50 cm, no sentido leste-oeste. Em terreno com até 3% de declive siga o declive; acima de 5% faça os canteiros atravessados (em patamares). Ordem: escolher a área, limpar, analisar o solo, preparar, corrigir (calcário e adubo de base pela análise), demarcar, levantar os canteiros, instalar a irrigação, colocar proteção (tela ou cobertura). Cobertura de palha ou plástico (mulching) segura a umidade e reduz o mato.'},
 {t:'Estufa, túnel e telado',k:'estufa tunel telado sombrite tela plastico anti-uv cobertura ambiente protegido tunel baixo inverno',f:'E-book Plantas ornamentais (2022), cap. 3',x:'Estufa: estrutura com cobertura plástica (de preferência com anti-UV), aberturas fixas ou móveis; é o abrigo mais usado. Túnel alto: para produção de mudas e plantas. Túnel baixo (1 a 1,2 m de largura por 0,6 m de altura, com arco e plástico leitoso): barato, protege do frio e de chuva forte e é ótimo para estaquia no inverno e para sementeira. Telado: tela de sombreamento; a porcentagem e a cor da tela mudam a luz que chega às plantas (há telas coloridas e aluminizadas para efeitos específicos).'},
 {t:'Legislação de mudas: RENASEM e identificação',k:'legislacao lei 10711 renasem registro mapa vender mudas comercializar responsavel tecnico etiqueta identificacao cultivar protegida royalty',f:'E-book Plantas ornamentais (2022), cap. 4 (Lei 10.711/2003 e Lei 9.456/1997)',x:'Pela Lei de Sementes e Mudas (Lei 10.711/2003), quem produz, embala, armazena ou comercializa mudas deve estar inscrito no RENASEM (Registro Nacional de Sementes e Mudas, do MAPA); o produtor de mudas para venda atua com responsável técnico. As mudas precisam ser identificadas na embalagem, etiqueta ou rótulo, e o MAPA fiscaliza produção, transporte e venda. Cultivares protegidas pela Lei de Proteção de Cultivares (Lei 9.456/1997) pagam royalty: não multiplique para venda uma variedade protegida sem licença. Confira os detalhes atualizados com o MAPA.'},
 {t:'Germinação de sementes',k:'germinacao semente semear sementeira temperatura luz dormencia quebra escarificar agua quente embeber fotoblastismo',f:'E-book Plantas ornamentais (2022), cap. 4',x:'Para germinar a semente precisa de água (embebe em três fases até sair a radícula), temperatura (a maioria entre 20 e 30 °C; mínimo 10–15 °C e máximo 35–40 °C), oxigênio (substrato arejado, sem encharcar) e, em algumas espécies, luz: há sementes que só germinam no claro (semeie na superfície), outras só no escuro (cubra) e outras indiferentes. Sementes dormentes precisam de quebra de dormência: escarificar (lixar ou cortar a casca), água quente, retirar o envoltório, deixar de molho, frio ou calor, conforme a espécie.'},
 {t:'Propagação por bulbos, rizomas e brotos',k:'bulbo cormo rizoma tuberculo raiz tuberosa estolao rebento filhote divisao touceira amarilis lirio agapanto gengibre clorofito kalanchoe',f:'E-book Plantas ornamentais (2022), cap. 4',x:'Bulbos (amarílis, lírio): separe os bulbinhos que nascem ao lado e plante para engordar. Cormos (gladíolo): idem, com os cormilhos. Rizomas (gengibre-ornamental, agapanto, helicônia): divisão de touceira, cada pedaço com gemas e raízes. Tubérculos (caládio, copo-de-leite) e raízes tuberosas (dália): divida mantendo uma gema por pedaço. Estolões, rebentos (clorofito) e filhotes: separe e plante quando tiverem raiz. Plântulas nas bordas das folhas (flor-da-fortuna): caem e enraízam sozinhas. Bulbos, cormos e tubérculos costumam ter dormência e podem ser guardados por um tempo.'},
 {t:'Estaquia, enxertia, mergulhia e alporquia',k:'estaquia estaca enraizar enxertia enxerto borbulha garfagem mergulhia alporquia micropropagacao clonagem aib enraizador',f:'E-book Plantas ornamentais (2022), cap. 4',x:'Na propagação vegetativa a muda é um clone da planta-mãe (mesma cor, forma e idade fisiológica), por isso dá lotes uniformes. Estaquia: de caule (roseira), de raiz (manacá-da-serra) ou de folha (violeta); enraizadores à base de auxina (AIB, ANA) aumentam o enraizamento. Enxertia: borbulha (uma gema, na primavera-verão; roseira), garfagem (um ramo; hibisco) ou encostia (quando o resto falha). Mergulhia: enterrar um ramo ainda ligado à planta (bela-emília). Alporquia: enraizar o ramo no alto da planta e depois cortar (camélia, plantas que não pegam de estaca). Micropropagação em laboratório: antúrio, orquídeas.'},
 {t:'Hormônios e reguladores de crescimento',k:'hormonio auxina giberelina citocinina etileno aba regulador enraizador redutor crescimento daminozide paclobutrazol porte compacto',f:'E-book Plantas ornamentais (2022), cap. 4',x:'Auxinas fazem raiz e alongam o caule: base dos enraizadores (AIB, ANA). Giberelinas alongam e quebram dormência; seus bloqueadores (como daminozide e paclobutrazol) deixam plantas de vaso mais baixas e compactas. Citocininas estimulam divisão celular e atrasam o envelhecimento. Etileno acelera o envelhecimento e a queda de flores e folhas: orquídeas, rosas e gerânios são sensíveis, lírios e íris pouco; não guarde plantas em flor perto de frutas maduras. Ácido abscísico é o hormônio do estresse (seca, calor, frio). Reguladores sintéticos são agrotóxicos: use só com orientação técnica.'},
 {t:'Substrato ideal e seus componentes',k:'substrato componente fibra de coco casca de pinus casca de arroz carbonizada vermiculita perlita areia turfa humus hidrogel retencao aeracao',f:'E-book Plantas ornamentais (2022), cap. 5',x:'Um bom substrato segura água sem perder o ar das raízes, não compacta com o tempo e é livre de doenças e sementes de mato. Componentes: casca de pinus (seca, triturada e compostada para tirar substâncias tóxicas), casca de arroz carbonizada (leve, arejada), fibra de coco (muito porosa, retém bastante água), vermiculita (retém cerca de 5 vezes seu peso em água, pH perto do neutro, segura nutrientes), perlita (leve, 3 a 4 vezes o peso), areia lavada (enraizamento, mas pobre), húmus de minhoca (nutrientes). Turfa vem de áreas de preservação: evite. Hidrogel retém 200 a 400 vezes o peso em água e reduz regas, mas é caro e pode concentrar sais.'},
 {t:'Terra vegetal, compostagem e venda de substrato',k:'terra vegetal terra preta composto compostagem leira temperatura higienizar vender substrato rotulo legislacao humus',f:'E-book Plantas ornamentais (2022), cap. 5 (IN MAPA 14/2004 e 25/2009; CONAMA 481/2017)',x:'Para fazer terra vegetal, seque o solo à sombra e peneire antes de misturar a matéria orgânica; solos argilosos que endurecem ao secar compactam no vaso e engrossam as raízes. Na compostagem, a fase quente higieniza: em leiras, acima de 55 °C por 14 dias ou acima de 65 °C por 3 dias (medir a temperatura todo dia). Material com relação C/N baixa (esterco, restos verdes) decompõe mais rápido; palha e serragem, mais devagar. Para vender substrato ou húmus embalado, a lei exige registro e rótulo com CE, pH, umidade máxima, densidade e capacidade de retenção de água.'},
 {t:'Sintomas de falta de nutrientes',k:'deficiencia nutriente folha amarela clorose nitrogenio fosforo potassio calcio magnesio enxofre ferro manganes zinco boro sintoma toxicidade',f:'E-book Plantas ornamentais (2022), cap. 6',x:'Nitrogênio (N): folhas velhas amarelas e caindo, planta pálida. Fósforo (P): planta baixa, em roseta, folhas verde-escuras ou arroxeadas. Potássio (K): manchas amarelas e queimadas nas pontas e bordas das folhas de baixo. Cálcio (Ca): folhas novas enrugadas e escuras, crescimento em roseta. Magnésio (Mg): amarelo entre as nervuras das folhas velhas, das bordas para o centro. Enxofre (S): folhas verde-amareladas, grossas e opacas. Ferro (Fe): amarelo entre as nervuras das folhas novas. Manganês (Mn): folhas velhas pálidas com pontinhos mortos. Zinco (Zn): folhas pequenas em roseta. Boro (B): necroses e folhas enrugadas. Excesso de um nutriente pode causar falta de outro. A maioria dos nutrientes fica disponível com pH entre 5,5 e 6,5.'},
 {t:'Condutividade elétrica (CE) e salinidade',k:'condutividade eletrica ce salinidade sais queima borda adubo excesso lixiviar lavar substrato medidor',f:'E-book Plantas ornamentais (2022), cap. 6',x:'A CE mede quanto adubo (sais) há no substrato. Leitura pelo método 1:2 (1 parte de substrato para 2 de água destilada), em dS/m: 0 a 0,25 muito baixa, adube mais vezes; 0,26 a 0,75 baixa, boa para mudas pequenas e forrações; 0,76 a 1,25 normal para a maioria; 1,26 a 1,75 alta, só água; 1,76 a 2,25 muito alta, risco de queima nas bordas e murcha, lave o substrato com rega abundante; acima de 2,25, lavar imediatamente. Plantas pouco exigentes e sensíveis a sal: avenca, bromélias, orquídeas. Média: a maioria das plantas de vaso. Muito exigentes: crisântemo, cravo, rosa, aspargo-ornamental.'},
 {t:'Adubos: quanto nutriente cada um tem',k:'adubo teor ureia sulfato de amonio superfosfato cloreto de potassio esterco farinha de osso torta de mamona calcario dolomitico npk cobertura base parcelar',f:'E-book Plantas ornamentais (2022), cap. 6',x:'Nitrogênio: ureia 45% N, sulfato de amônio 21%, nitrato de cálcio ~14% (bom para fertirrigação). Fósforo: superfosfato simples 18% P2O5 (traz também cálcio e enxofre), superfosfato triplo 45%. Potássio: cloreto de potássio 60% K2O, sulfato de potássio 50%. Orgânicos (aproximado): esterco de gado 1,7% N; esterco de galinha 3% N e 3% P2O5; composto 1,4% N; farinha de osso 20–29% P2O5; torta de mamona 4–6% N. Calcário dolomítico corrige acidez e dá cálcio e magnésio; não use cal virgem. Faça adubação de base no preparo e complete em várias doses pequenas (cobertura ou pela água) ao longo do cultivo, sempre guiado pela análise do solo ou substrato.'},
 {t:'Doenças: como surgem e princípios de controle',k:'doenca fungo bacteria virus nematoide fitoplasma triangulo prevencao controle erradicar exclusao abiotica',f:'E-book Plantas ornamentais (2022), cap. 7',x:'Doença precisa de três coisas juntas: patógeno, planta suscetível e ambiente favorável (umidade e temperatura). Fungos: manchas, podridões, tombamento, pó na folha; espalham por água, vento, ferramentas e mudas doentes. Bactérias: murcha, manchas encharcadas, podridão mole; espalham por respingos e ferimentos. Vírus: mosaico, folhas deformadas e anéis; levados por insetos (pulgão, mosca-branca) e mãos; não têm cura, elimine a planta. Nematoides: galhas nas raízes, nanismo; vêm no solo e nas botas. Controle por etapas: impedir a entrada (mudas e substrato sadios), eliminar fontes (restos doentes), proteger, usar variedades resistentes e mudar o ambiente (ventilação, rega sem molhar folhas). Alguns sintomas não são doença: falta de luz (estiolamento), frio (bronzeado), excesso de cobre (manchas) e seca (folhas enroladas).'},

function buscarConhecimento(pergunta,n=4){
  const pal=semAcento(pergunta).toLowerCase().split(/\s+/).filter(w=>w.length>3);
  if(!pal.length)return [];
  const pont=t=>{const s=semAcento(t).toLowerCase();return pal.reduce((a,w)=>a+(s.includes(w.slice(0,Math.max(4,w.length-2)))?1:0),0)};
  return CONHEC.map(c=>({c,p:pont(c.k)*2+pont(c.t)*2+pont(c.x)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p).slice(0,n).map(x=>x.c);
}

async function lerBarrasFrame(v){

async function entregarArquivo(nome,conteudo,tipo){
  const blob=new Blob([conteudo],{type:tipo});
  try{const file=new File([blob],nome,{type:tipo});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nome});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove()}catch(e){}
  const {bg}=folha(`<div class="sb"><h3>${esc(nome)}</h3><div class="muted" style="font-size:14px">Se o arquivo não foi salvo, copie o conteúdo abaixo e cole num arquivo de texto.</div>

  $('#cpArq',bg).onclick=async()=>{const t=$('#txArq',bg);try{await navigator.clipboard.writeText(t.value);toast('Copiado')}catch(e){t.select();toast('Selecione e copie')}};
}

/* ============ SINCRONIZAÇÃO ============ */
let sincronizando=false;
async function api(corpo){
  const r=await fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...corpo,token:S.cfg.token})});
  const j=await r.json();if(!j.ok)throw new Error(j.erro||'erro na planilha');return j;
}
function registroParaPlanilha(tabela,r){
  const {blob,...x}=r;
  if(tabela==='itens')x.especieNome=nomeDe(r);
  if(tabela==='eventos'||tabela==='fotos'||tabela==='ocorrencias')x.codigo=codigoDe(r.itemId);
  if(tabela==='ocorrencias')x.problemaNome=nomeProblema(r);
  if(tabela==='fotos'&&x.fileId)x.link='https://drive.google.com/file/d/'+x.fileId+'/view';
  return x;
}
async function sincronizar(manual){
  if(sincronizando)return;
  if(!S.cfg.url||!S.cfg.token){if(manual){toast('Ligue a planilha em Mais › Sincronização');ir('sync')}return}
  if(!navigator.onLine){if(manual)toast('Sem internet. Tudo fica guardado no celular e vai depois.');return}
  sincronizando=true;const b=$('#btnSync');b.textContent='Enviando…';
  try{
    let ob=await DB.all('outbox');
    for(const o of ob.filter(o=>o.tabela==='fotos')){const f=await DB.get('fotos',o.refId);
      if(f&&f.blob&&!f.fileId&&!f.excluido){const etq=f.tipo==='etiqueta';const cod=codigoDe(f.itemId)||'foto';
        const r=await api({action:'foto',tipo:etq?'etiqueta':'foto',mime:etq?'image/png':'image/jpeg',nome:etq?`etiqueta_${cod}.png`:`${cod}_${f.id.slice(0,8)}.jpg`,base64:await blobB64(f.blob)});
        f.fileId=r.fileId;await DB.put('fotos',f);const i=S.fotos.findIndex(x=>x.id===f.id);if(i>=0)S.fotos[i]=f}}
    ob=await DB.all('outbox');
    for(let i=0;i<ob.length;i+=80){const lote=ob.slice(i,i+80);const mud=[];
      for(const o of lote){const r=await DB.get(o.tabela,o.refId);if(r)mud.push({tabela:o.tabela,registro:registroParaPlanilha(o.tabela,r)})}
      if(mud.length)await api({action:'sync',mudancas:mud});
      for(const o of lote){const atualO=await DB.get('outbox',o.id);if(atualO&&atualO.ts===o.ts)await DB.del('outbox',o.id)}}
    S.cfg.ultimaSync=new Date().toISOString();await salvarCfg();
    S.pend=(await DB.all('outbox')).length;if(manual)toast('Planilha atualizada');
  }catch(e){console.error(e);if(manual)toast('Não consegui falar com a planilha. Confira o endereço e o código de acesso.')}
  finally{sincronizando=false;pintarSync();if(atual.v==='sync')render()}
}

  <form id="fSync" class="card" style="display:flex;flex-direction:column;gap:12px">
    <label class="f">Endereço do script da planilha<input name="url" value="${esc(S.cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url" autocapitalize="off"></label>

    <label class="f">O QR da etiqueta leva<select name="qrModo"><option value="link" ${S.cfg.qrModo!=='texto'?'selected':''}>Link da ficha (sempre atualizada)</option><option value="texto" ${S.cfg.qrModo==='texto'?'selected':''}>Os dados do lote em texto</option></select><small>Sem endereço do app, o QR leva o texto.</small></label>

    <button class="btn pri" type="submit">Salvar</button></form>
  <div class="row"><button class="btn" id="sAgora">Enviar agora</button><button class="btn" id="sBaixar">Baixar tudo da planilha</button></div>
  <div class="muted" style="font-size:14px">O app envia sozinho ao abrir e quando a internet volta. “Baixar tudo” serve para trocar de celular: substitui os dados deste aparelho pelos da planilha.</div>`;
  $('#fSync').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);
    S.cfg.url=String(f.get('url')).trim();S.cfg.token=String(f.get('token')).trim();S.cfg.appUrl=String(f.get('appUrl')).trim();S.cfg.qrModo=f.get('qrModo')||'link';S.cfg.diasRega=num(f.get('diasRega'))||2;S.cfg.diasAdubo=num(f.get('diasAdubo'))||30;S.cfg.diasRevCaixa=num(f.get('diasRevCaixa'))||15;
    await salvarCfg();toast('Configuração salva');sincronizar(true)};
  $('#sAgora').onclick=()=>sincronizar(true);
  const bb=$('#sBaixar');bb.onclick=async()=>{if(!S.cfg.url){toast('Configure o endereço primeiro');return}
    if(!bb.dataset.conf){bb.dataset.conf=1;bb.textContent='Toque de novo para substituir';return}
    bb.textContent='Baixando…';
    try{const r=await api({action:'pull'});
      for(const t of TABS){if(!Array.isArray(r[t]))continue;const locais=new Map((await DB.all(t)).map(x=>[x.id,x]));await DB.clear(t);
        for(const x of (r[t]||[])){if(t==='fotos'&&locais.get(x.id)?.blob)x.blob=locais.get(x.id).blob;await DB.put(t,x)}}
      await DB.clear('outbox');await carregar();toast('Dados baixados da planilha');aba('inicio')}
    catch(e){toast('Não consegui baixar: '+e.message);bb.textContent='Baixar tudo da planilha';delete bb.dataset.conf}};
};

  await ev(l1,'reavaliacao',130,{ocorrenciaId:t1.id,nota:'Resolvida'});

  await ev(b1,'transf_entrada',60,{qtd:72});await ev(l1,'transf_saida',60,{qtd:72,nota:'Para '+b1.codigo});
  await regas(l1,[1,3,5,7,9,11,13]);await ev(b1,'adubacao',10,{produto:'NPK 10-10-10, 5 g/L'});
  await ev(b1,'crescimento',5,{altura:22,estagio:'Crescimento',nota:'Folhas novas avermelhadas, bom vigor'});

  await ev(m1,'transf_entrada',20,{qtd:1});await ev(b1,'transf_saida',20,{qtd:1,nota:'1 muda individual'});
  await venda(l1,8,12,18,2.4,'Feira de domingo');await venda(l1,40,10,18,2.4,'Feira de domingo');await venda(l1,100,15,17,2.4,'Paisagista Ana');
  // Manacá: rustificando, com pulgão em aberto
  const l2=await mk({tipo:'lote',codigo:novoCodigo(esp[1]),especieId:esp[1].id,dataEntrada:diasAtras(220),local:'Telado sombreado',origem:'Estaca',custoUnit:4.1,precoVenda:38,etapa:'Rustificação',dataEtapa:diasAtras(20)});
  await ev(l2,'entrada',220,{qtd:60});await regas(l2,[3,6,9,12]);await ev(l2,'adubacao',50,{produto:'Esterco curtido'});

  await ev(l3,'entrada',400,{qtd:25});await regas(l3,[2,6,10]);await ev(l3,'adubacao',20,{produto:'Adubo foliar'});

  // Helicônia: rustificação concluída
  const l4=await mk({tipo:'lote',codigo:novoCodigo(esp[3]),especieId:esp[3].id,dataEntrada:diasAtras(120),local:'Estufa 2',origem:'Divisão de touceira',custoUnit:3.5,etapa:'Rustificação',dataEtapa:diasAtras(35)});

  await venda(l4,25,8,22,3.5);await venda(l4,90,6,22,3.5);

  const l5=await mk({tipo:'lote',codigo:novoCodigo(esp[4]),especieId:esp[4].id,dataEntrada:diasAtras(15),local:'Sementeira',origem:'Semente',custoUnit:1.2,etapa:'Germinação',dataEtapa:diasAtras(15)});

(async function iniciar(){
  await DB.open();await carregar();aplicarTema();
  const h=decodeURIComponent(location.hash||'');
  if(h.startsWith('#c-')){publico=true;$('#tabs').hidden=true;$('#btnMais').hidden=true;$('#btnTema').hidden=true;$('#btnIA').hidden=true;document.querySelector('main').style.paddingBottom='32px';pintarSync();atual={v:'cliente',p:h.slice(3).toUpperCase()};render();return}
  if(S.itens.some(i=>i.exemplo)&&S.cfg.exVer!==3){for(const t of TABS)for(const r of S[t].filter(x=>x.exemplo))await DB.del(t,r.id);await carregar();S.cfg.ultimoSerial=0}
  if(!S.itens.length&&!S.cfg.exemplosApagados&&!S.cfg.url){await criarExemplos();S.cfg.exVer=3;await salvarCfg()}
  try{await semearCompras()}catch(e){console.warn(e)}
  pintarSync();render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude|anthropic/.test(location.hostname))navigator.serviceWorker.register('./sw.js')}catch(e){}
  sincronizar(false);
  window.addEventListener('online',()=>sincronizar(false));
  setInterval(()=>{if(S.pend>0)sincronizar(false)},60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sincronizar(false)});
})();
</script>
